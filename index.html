        {id:1, text:"The essential component of culture is____?", opts:["Dance","Idol worship","Song","Language"], ans:"D"},

        {id:6, text:"Nigeria has an area of over _____Km2 ?", opts:["900000","800000","700000","600000"], ans:"A"},
        {id:7, text:"The ____were the first to be visited by the Europeans as early as 1472 A.D. in pre-colonial Nigeria?", opts:["Bini","Itsekiri","Urhobo","Yoruba"], ans:"A"},

        {id:9, text:"Nigeria is bordered in the north and east the following republics except___?", opts:["Niger & Benin","Chad & Cameroun","Niger & Cameroun","Benin & Cameroun"], ans:"C"},

        {id:11, text:"Nigeria lies between ___ and___ of the Equators?", opts:["40E and 140E","140N and 200N","40E and 140N","40N and 140N"], ans:"D"},
        {id:12, text:"Rights of citizens of the society are protected by __?", opts:["Cabinet members","Police force","Law","Courts"], ans:"C"},
        {id:13, text:"In Ancient Greece, in Athenian city, one of the groups recognized as citizens are __?", opts:["The Proletariats","The servants","The Artisans","Members of the ruling class"], ans:"D"},

        {id:18, text:"The America Declaration of Independent took place in the year___?", opts:["1776","1788","1730","1755"], ans:"A"},
        {id:19, text:"In Nigeria, the required period of time for an applicant to acquire citizenship is ___?", opts:["10years","15 years","20 years","5 years"], ans:"B"},
        {id:20, text:"Citizenship by jurisdiction is associated with __?", opts:["International law","Domestic law","Natural law","None of the above"], ans:"A"},
        {id:21, text:"Citizenship by Nationality relates to ___?", opts:["Municipal law","international law","Natural law","None of the above"], ans:"B"},
        {id:22, text:"The various tribes in Nigeria are distinguished by the following save for____?", opts:["Language & Custom","Dress Style","Hair Styles","Technologies & Innovations"], ans:"C"},
        {id:23, text:"The Principal tribes in order of population size in Nigeria include the following save for___?", opts:["Hausa","Yoruba","Ibo","Edo"], ans:"D"},
        {id:24, text:"The pre-colonial southern Nigeria can best be described as___?", opts:["The colonial rule","The period before the contact and formal introduction of colonial rule","All of the above","The period after the contact and formal introduction of colonial rule"], ans:"B"},
        {id:25, text:"The ____ people are best known for their segmentary or acephalous way of life?", opts:["Fulani","Igbo","Hausa","Igala"], ans:"B"},
        {id:26, text:"Iginuwa is known as the man through whom the kingdom of ______is said to have been established?", opts:["Itsekiri","Oyo","Urhobo","Bini"], ans:"A"},
        {id:27, text:"The ____ people share almost the same stories of origin with their Itsekiri and Urhobo counterparts?", opts:["Delta","Ijaw","Rivers","Ilaje"], ans:"B"},
        {id:28, text:"The ____ people represent one of the important and politically dominant groups in Northern Nigeria?", opts:["Abuja","Benue","Hausa","Kaduna"], ans:"C"},
        {id:29, text:"_____ is the language that unites all the Kanem-Bornu people?", opts:["Fulfude","Kanuri","SO","Ida"], ans:"B"},
        {id:30, text:"During the colonial rule, the southern Nigeria was made up of the following except__?", opts:["South – South Region","Western Region","Eastern Region","Mid-Western Region"], ans:"A"},
        {id:31, text:"The southern Nigeria today is made up of the following except___?", opts:["South – South Region","The West","Mid-Western Region","The East"], ans:"C"},
        {id:32, text:"The following is a State in the West of Southern Nigeria except___?", opts:["Ekiti State","Osun State","Ondo State","Edo State"], ans:"D"},
        {id:33, text:"The ___ State was located on the North bank of the Niger at its confluence with the River Kaduna?", opts:["Nupe","Yoruba","Oyo","Kaduna"], ans:"A"},
        {id:34, text:"Any person born within the territorial jurisdiction of a state automatically becomes the citizen of a state by___?", opts:["Jus soli","Jus sagineris","Jus sanguinis","Jus Justus"], ans:"A"},
        {id:35, text:"Citizenship by birth in latin words means__?", opts:["Jus soli","Jus sagineris","Jus sanguinis","Jus Justus"], ans:"C"},
        {id:36, text:"What law permits a non-citizen of a state who was born or naturalized in another state to become a citizen of that state__?", opts:["Law of the land","political law","Law of Nationality","Municipal law"], ans:"A"},
        {id:37, text:"A child born in a registered ship automatically becomes the citizen of the state where the ship is registered irrespective of the citizenship of the child's parents by virtue of___?", opts:["Law of ship","Law of craft","Law of Nationality","Law of the soil"], ans:"D"},
        {id:38, text:"One of these is a method of acquiring citizenship status___?", opts:["By Democracy","By voting","By legal process","By permission"], ans:"C"},
        {id:39, text:"One of these is not one of the ways of acquiring citizenship status by legal process?", opts:["Collective","Derivative","Direct","None of the above"], ans:"D"},
        {id:40, text:"Industrial Revolution took place in the__?", opts:["Modern age","Medieval age","Ancient age","Stone age"], ans:"A"},
        {id:41, text:"The Renaissance age of the modern age took place in__?", opts:["15th-16th c","18th-17th c","16th-17th c","19th-20th c"], ans:"A"},
        {id:42, text:"A citizen of Nigeria by birth does not include?", opts:["Those born in Nigeria before independence whose parents are Nigerians","Born in Nigeria after independence whose grandparents are Nigerians","Those of whose parents are not Nigerians","those born abroad but whose parents are Nigerians"], ans:"B"},
        {id:43, text:"The following is a State in the East of Southern Nigeria except___?", opts:["Ebonyi State","Akwa Ibom State","Enugu State","Imo State"], ans:"B"},
        {id:44, text:"The following is a State in the South-south of Southern Nigeria except____?", opts:["Abia State","Bayelsa State","Delta State","Rivers State"], ans:"A"},
        {id:45, text:"Before the colonial rule the chief executive officer had various titles of the Yoruba people depending on the location. Such titles include the following except__?", opts:["Deji","Alafin","Eze","Ooni"], ans:"C"},
        {id:46, text:"The King in Yorubaland administers the head quarter and other areas by subordinates’ chiefs known as ___?", opts:["Ekhamwen","Eze","Enogie","Baale or Oloja"], ans:"D"},
        {id:47, text:"In some cases, in Yorubaland, the king is seen as partly divine which makes him perform ___sacrifices on behalf of his people except?", opts:["administrative","Priestly/religious","judiciary","All of the above"], ans:"B"},
        {id:48, text:"The primary roles of the baale or oloja includes the following except ___?", opts:["Priestly/religious","Settlement of disputes","Payment of tributes to the king","Maintenance of law and order"], ans:"A"},
        {id:49, text:"The pre-colonial Yoruba kingship system was hereditary and the king was usually selected from the ____?", opts:["Baales","Royal Olojas","Royal lineage","All of the above"], ans:"C"},
        {id:50, text:"The senior chiefs in pre-colonial Yorubaland can do the following things except ___?", opts:["Advise and monitor the activities of the Oba","Force the Oba to commit suicide","Force the people from paying homage to the Oba","Overthrow the Oba"], ans:"D"},
        {id:51, text:"The view that the cycle of growth and decay is single and unique and never repeated because it was providentially determined belongs to ___?", opts:["Greek","Christian","Buddhist","none of the above"], ans:"B"},
        {id:52, text:"The first in history to make science out of study of change was___?", opts:["Greeks","Romans","European","Asians"], ans:"A"},
        {id:53, text:"The 6-3-3-4 system of Education was established in the year__?", opts:["1981","1886","1987","1980"], ans:"A"},
        {id:54, text:"The name of the first university of Nigeria is___?", opts:["University of Ibadan","Obafemi Awolowo University, Ife","University of Nigeria, Nsukka","University of Lagos"], ans:"C"},

        {id:56, text:"As at 1960, Nigeria had only __?", opts:["one university","Two universities","five universities","27 universities"], ans:"A"},

        {id:58, text:"The limitations of citizens on the right to own property is found in the law use Decree of ___?", opts:["1999","1989","1978","1977"], ans:"D"},
        {id:59, text:"The legal process whereby a Child/Spouse becomes or acquires a citizenship status as a result of the parents, spouses or relatives is referred to as __?", opts:["Double","Single","Collective","Derivative"], ans:"D"},
        {id:60, text:"One of these is not a condition considered in acquiring citizenship__?", opts:["Language","Residency","Moral character","Literacy"], ans:"D"},
        {id:61, text:"The Residence duration required for acquisition of citizenship in USA is___?", opts:["10 years","15 years","5 years","2 years"], ans:"C"},
        {id:62, text:"The Residence duration required for acquisition of citizenship in Switzerland is___?", opts:["12 years","10 years","13 years","7 years"], ans:"A"},
        {id:63, text:"The Residence duration required for acquisition of citizenship in Britain is___?", opts:["5 years","10 years","1 year","3 years"], ans:"C"},
        {id:64, text:"One of these is not a method of Termination of citizenship as __?", opts:["Denationalization","Expatriation","All of the above","None of the above"], ans:"C"},
        {id:65, text:"An USA Naturalized National can lose his status if he stays in another country for a period of__?", opts:["3 years","5 years","2 years","8 years"], ans:"B"},

        {id:67, text:"A Nigerian National can lose his status if he within seven years he gets imprisonment for a term not less than a period of  ___?", opts:["1 years","3 years","4 years","5 years"], ans:"B"},
        {id:68, text:"Loss of citizenship by voluntary renouncement of one's status either by a person who acquires his status by birth or by Naturalization is known as __?", opts:["Denaturalization","Expatriation","Withdrawal of legal recognition using force","Deportation"], ans:"B"},
        {id:69, text:"The rights of individuals in a state is divided into two?", opts:["Legal and Political","Economic and Political","Political and Civil","Technical and Scientific"], ans:"A"},
        {id:70, text:"The system of age grades practiced in every locality in pre-colonial Yorubaland helps in the following functions except__?", opts:["Policing","Settlements of disputes","Clearing of parts","Enforcing the King’s decisions"], ans:"B"},
        {id:71, text:"The centralized chiefdom/kingdom practiced in the pre-colonial Yoruba people was also practiced by the __?", opts:["Binis","Igbos","Hausas","Efiks"], ans:"A"},

        {id:73, text:"The Oba of Benin’s stool is hereditary and specifically through ___?", opts:["Royal lineage","Appointment","All of the above","Primogeniture"], ans:"D"},
        {id:74, text:"In Benin the palace chiefs are divided into three societies and it includes all except __?", opts:["The Iwebo","The Uzama","The Ibiwe","The Iweguae"], ans:"B"},
        {id:75, text:"The crown prince (Okoro N’okhua) is named Edaiken by the Oba and crowned by the ___ when the incumbent oba joins his ancestors?", opts:["The Uzama","The Ibiwe","The Iweguae","The Iwebo"], ans:"A"},

        {id:79, text:"The town chiefs in Benin Kingdom known as Ekha’emwen are grouped into two categories, called ekha’emwen N’ore and ekha’emwen N’ogbe and headed by the ___?", opts:["The Iyase (Prime Minister)","The Oba","The Ekha’emwen","The Enogie"], ans:"A"},

        {id:81, text:"The suburb towns and villages in Benin kingdom are administered by the Inigies or Chiefs installed by the __?", opts:["Priests","Ekha’emwen","People","Oba"], ans:"D"},
        {id:82, text:"The Enogie assisted by Odionwere the Edion (oldest age groups) as constituted by the village council performs the following roles except__?", opts:["Priestly/religious","Deliberate and Settlement of disputes","Payment of tributes to the oba","Make minor laws"], ans:"B"},
        {id:83, text:"The Oba and each Enogie has powers of life and death over ____ in pre-colonial Benin Kingdom?", opts:["Subjects","Ekha’emwen","Strangers","All of the above"], ans:"A"},

        {id:199, text:"France provided weapons to:", opts:["Federal government","Biafra","Both sides","Neither"], ans:"B"},
        {id:200, text:"The Gulf War windfall of 1991 gave Nigeria:", opts:["War","Unexpected oil revenue","Recession","End of military rule"], ans:"B"}
    ];
    // Ensure exactly 200 unique items
    const MASTER_BANK = FULL_BANK.slice(0,200);
    
    // ------------------- Exam State -------------------
    let examQuestions = [];      // 70 random selected
    let userAnswers = [];
    let skippedStatus = [];
    let currentIndex = 0;
    let timeSeconds = 45 * 60;
    let timerInterval = null;
    let examActive = false;
    let examSubmitted = false;
    const root = document.getElementById('appRoot');

    function saveState() {
        if (!examActive || examSubmitted) return;
        const state = { examQuestions, userAnswers, skippedStatus, currentIndex, timeSeconds, examActive, examSubmitted };
        localStorage.setItem('gst_exam_state', JSON.stringify(state));
    }
    function loadSavedState() {
        const saved = localStorage.getItem('gst_exam_state');
        if (saved) {
            try {
                const s = JSON.parse(saved);
                if (s.examActive && !s.examSubmitted) {
                    examQuestions = s.examQuestions;
                    userAnswers = s.userAnswers;
                    skippedStatus = s.skippedStatus || new Array(70).fill(false);
                    currentIndex = s.currentIndex;
                    timeSeconds = s.timeSeconds;
                    examActive = true;
                    examSubmitted = false;
                    startTimer();
                    renderExam();
                    return true;
                }
            } catch(e) {}
        }
        return false;
    }
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!examActive || examSubmitted) return;
            if (timeSeconds <= 0) {
                clearInterval(timerInterval);
                autoSubmitExam();
            } else {
                timeSeconds--;
                updateTimerDisplay();
                saveState();
            }
        }, 1000);
    }
    function updateTimerDisplay() {
        const mins = Math.floor(timeSeconds / 60);
        const secs = timeSeconds % 60;
        const el = document.getElementById('timerDisplay');
        if (el) el.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }
    function autoSubmitExam() {
        if (examSubmitted) return;
        examSubmitted = true;
        examActive = false;
        clearInterval(timerInterval);
        localStorage.removeItem('gst_exam_state');
        renderReview();
    }
    function submitExamWithConfirm() {
        if (confirm("⚠️ Are you sure you want to submit the exam? You cannot change answers after submission.")) {
            clearInterval(timerInterval);
            examSubmitted = true;
            examActive = false;
            localStorage.removeItem('gst_exam_state');
            renderReview();
        }
    }
    function renderReview() {
        const failed = [];
        examQuestions.forEach((q, idx) => {
            const user = userAnswers[idx];
            const correctLetter = q.ans;
            const isCorrect = (user === correctLetter);
            if (!isCorrect) {
                const userText = user ? q.opts[user.charCodeAt(0)-65] : "Not answered";
                const correctText = q.opts[correctLetter.charCodeAt(0)-65];
                failed.push({ text: q.text, user: userText, correct: correctText });
            }
        });
        let html = `<div class="review-screen"><div class="review-header">📋 Review: Failed & Unanswered Questions</div>`;
        if (failed.length === 0) html += `<p style="color:green;">🎉 Perfect score! All 70 correct.</p>`;
        else {
            failed.forEach(f => {
                html += `<div class="failed-card"><strong>${f.text}</strong><br>Your answer: ${f.user} &nbsp; ✅ Correct: ${f.correct}</div>`;
            });
        }
        html += `<button class="return-home" id="restartExamBtn">🏠 Start New Exam</button></div>`;
        root.innerHTML = html;
        document.getElementById('restartExamBtn')?.addEventListener('click', () => {
            localStorage.removeItem('gst_exam_state');
            location.reload();
        });
    }
    function skipQuestion() {
        if (!examActive) return;
        if (userAnswers[currentIndex] === null) {
            skippedStatus[currentIndex] = true;
            saveState();
        }
        if (currentIndex < examQuestions.length - 1) {
            currentIndex++;
            renderExam();
        } else {
            renderExam(); // stay, but mark skipped
        }
    }
    function renderExam() {
        const q = examQuestions[currentIndex];
        const selected = userAnswers[currentIndex];
        const isSkipped = skippedStatus[currentIndex];
        const navBtns = examQuestions.map((_, idx) => {
            let cls = '';
            if (userAnswers[idx] !== null) cls = 'answered';
            else if (skippedStatus[idx]) cls = 'skipped';
            if (idx === currentIndex) cls += ' active';
            return `<div class="nav-btn ${cls}" data-idx="${idx}">${idx+1}</div>`;
        }).join('');
        const optionsHtml = ['A','B','C','D'].map(letter => {
            const optText = q.opts[letter.charCodeAt(0)-65];
            const isSelected = selected === letter;
            return `<div class="option ${isSelected ? 'selected' : ''}" data-letter="${letter}"><span class="prefix">${letter}</span> ${optText}</div>`;
        }).join('');
        const isLast = (currentIndex === examQuestions.length - 1);
        const html = `
        <div class="exam-container">
            <div class="exam-header">
                <div class="title"><h1>📚 GST Nigerian Culture (200+ Bank)</h1><p>70 random · 45 min</p></div>
                <div class="timer-box"><div class="timer-label">TIME LEFT</div><span id="timerDisplay">45:00</span></div>
            </div>
            <div class="exam-body">
                <div class="question-nav">
                    <div class="nav-header">📌 Navigator <span class="legend"><span style="background:#2b7a4b;"></span>Answered <span style="background:#f4a261;"></span>Skipped</span></div>
                    <div class="nav-grid" id="navGrid">${navBtns}</div>
                    <div class="submit-area"><button class="submit-exam" id="submitExamFinal">✅ SUBMIT EXAM</button></div>
                </div>
                <div class="question-panel">
                    <div class="q-text">${q.text} ${isSkipped ? '<span class="skip-indicator">⏩ Skipped</span>' : ''}</div>
                    <div class="options-list" id="optionsContainer">${optionsHtml}</div>
                    <div class="action-buttons">
                        <button class="btn-nav" id="prevQ">◀ PREV</button>
                        <button class="btn-nav btn-skip" id="skipBtn">⏩ SKIP</button>
                        <button class="btn-nav" id="nextQ">NEXT ▶</button>
                        ${isLast ? '<button class="btn-nav" id="lastSubmitBtn" style="background:#e76f51;">📬 SUBMIT</button>' : ''}
                    </div>
                </div>
            </div>
        </div>`;
        root.innerHTML = html;
        updateTimerDisplay();
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                const letter = opt.dataset.letter;
                userAnswers[currentIndex] = letter;
                skippedStatus[currentIndex] = false;
                saveState();
                renderExam();
            });
        });
        document.getElementById('prevQ')?.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderExam(); } });
        document.getElementById('skipBtn')?.addEventListener('click', () => skipQuestion());
        document.getElementById('nextQ')?.addEventListener('click', () => { if (currentIndex < examQuestions.length-1) { currentIndex++; renderExam(); } });
        document.getElementById('submitExamFinal')?.addEventListener('click', () => submitExamWithConfirm());
        document.getElementById('lastSubmitBtn')?.addEventListener('click', () => submitExamWithConfirm());
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                if (!isNaN(idx)) { currentIndex = idx; renderExam(); }
            });
        });
    }
    function initExam() {
        const shuffled = [...MASTER_BANK];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        examQuestions = shuffled.slice(0, 70);
        userAnswers = new Array(70).fill(null);
        skippedStatus = new Array(70).fill(false);
        currentIndex = 0;
        timeSeconds = 45 * 60;
        examActive = true;
        examSubmitted = false;
        startTimer();
        renderExam();
        saveState();
    }
    function startScreen() {
        root.innerHTML = `<div class="start-screen"><h2>🎓 Nigerian Peoples & Culture CBT</h2><div class="instruction-box">
            <strong>📌 Exam Features:</strong><br>
            ✔️ 70 random questions from a bank of 200+ authentic questions (Excel + PDF).<br>
            ✔️ Timer: 45 minutes – auto‑submit on expiry.<br>
            ✔️ Navigation: <span style="background:#2b7a4b;color:white;padding:2px 8px;">Green</span> = answered &nbsp; <span style="background:#f4a261;color:#2d2a24;padding:2px 8px;">Orange</span> = skipped &nbsp; <span style="background:#0f2b3d;color:white;padding:2px 8px;">Blue</span> = current.<br>
            ✔️ <strong>Skip button</strong> marks question as skipped and moves forward.<br>
            ✔️ <strong>Submit confirmation</strong> appears before final submission.<br>
            ✔️ Resume support (local storage) – close/reopen continues.<br>
            ✔️ Review page shows only failed/unanswered questions after submission.
        </div><button class="btn-start" id="beginExamBtn">🚀 START EXAM</button></div>`;
        document.getElementById('beginExamBtn')?.addEventListener('click', () => {
            localStorage.removeItem('gst_exam_state');
            initExam();
        });
    }
    if (!loadSavedState()) startScreen();
</script>
