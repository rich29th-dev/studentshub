<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHM 102 · Chemistry of Metals and Non-Metals Quiz - Dr Akpa</title>
    <style>
        :root {
            --bg: #f0f4f8; --card-bg: #ffffff; --primary: #00695c; --primary-dark: #004d40;
            --accent: #1a1a2e; --text: #2d3436; --text-light: #636e72; --border: #dfe6e9;
            --correct: #00b894; --incorrect: #e17055; --warning: #fdcb6e;
            --shadow: 0 4px 20px rgba(0,0,0,0.08); --radius: 16px; --transition: 0.3s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            padding:20px;line-height:1.6;color:var(--text);
        }
        .container{
            width:100%;max-width:850px;background:var(--card-bg);
            border-radius:var(--radius);box-shadow:var(--shadow);
            padding:32px 28px;position:relative;overflow:hidden;transition:var(--transition);
        }
        .quiz-header{text-align:center;margin-bottom:20px;}
        .quiz-header .metal-icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .quiz-header h1{font-size:1.5rem;color:var(--primary-dark);font-weight:700;}
        .subtitle{font-size:0.85rem;color:var(--text-light);margin-top:4px;}
        .screen{display:none;animation:fadeIn 0.4s;}
        .screen.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
        .start-options{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0 18px;}
        .start-btn{
            flex:1;min-width:150px;padding:22px 16px;border:2px solid var(--border);
            border-radius:var(--radius);background:var(--card-bg);cursor:pointer;
            text-align:center;font-weight:600;transition:var(--transition);color:var(--text);
        }
        .start-btn:hover{border-color:var(--primary);box-shadow:0 8px 20px rgba(0,105,92,0.12);transform:translateY(-2px);}
        .start-btn .icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .start-btn .badge{background:var(--primary);color:#fff;font-size:0.75rem;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:6px;}
        .start-info{font-size:0.8rem;color:var(--text-light);text-align:center;}
        .progress-wrap{margin-bottom:16px;}
        .progress-stats{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-light);margin-bottom:4px;}
        .progress-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#009688);border-radius:10px;transition:width 0.4s;}
        .question-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
        .dot{width:10px;height:10px;border-radius:50%;background:var(--border);cursor:pointer;transition:var(--transition);}
        .dot.answered{background:var(--primary);opacity:0.6;}
        .dot.current{background:var(--primary);transform:scale(1.5);box-shadow:0 0 0 4px rgba(0,105,92,0.2);}
        .dot.skipped{background:var(--warning);}
        .question-card{background:#fafbfc;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid var(--border);}
        .question-number{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--primary);font-weight:700;margin-bottom:6px;}
        .question-text{font-size:1.05rem;font-weight:600;color:var(--text);}
        .options-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px;}
        .option-item{
            padding:14px 16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;
            display:flex;align-items:center;gap:10px;transition:var(--transition);font-size:0.95rem;user-select:none;
        }
        .option-item:hover{border-color:#b2bec3;background:#f8f9fa;}
        .option-item.selected{border-color:var(--primary);background:#e0f2f1;font-weight:600;}
        .option-item .radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
            display:flex;align-items:center;justify-content:center;transition:var(--transition);}
        .option-item.selected .radio-dot{border-color:var(--primary);background:var(--primary);}
        .option-item.selected .radio-dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%;}
        .option-item .opt-letter{font-weight:700;color:var(--primary);width:24px;}
        .nav-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px;}
        .btn{padding:11px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:600;font-size:0.9rem;
            transition:var(--transition);display:inline-flex;align-items:center;gap:6px;}
        .btn-outline{background:#fff;border:2px solid var(--border);color:var(--text);}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
        .btn-primary{background:var(--primary);color:#fff;border:2px solid var(--primary);}
        .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn-submit{background:var(--accent);color:#fff;border:2px solid var(--accent);font-size:1rem;padding:13px 32px;}
        .btn-submit:hover{background:#2d2d4e;}
        .btn:disabled{opacity:0.5;pointer-events:none;}
        .results-card{text-align:center;}
        .score-circle{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;
            justify-content:center;flex-direction:column;border:6px solid var(--primary);font-weight:700;}
        .score-circle .big-score{font-size:2.8rem;color:var(--primary);}
        .score-circle .total{font-size:0.9rem;color:var(--text-light);}
        .result-message{font-size:1.1rem;margin-bottom:20px;font-weight:500;}
        .review-section{text-align:left;margin-top:24px;max-height:400px;overflow-y:auto;padding-right:8px;}
        .review-item{background:#fafbfc;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border);font-size:0.9rem;}
        .review-item.wrong{border-left-color:var(--incorrect);background:#fffaf9;}
        .review-item.correct-r{border-left-color:var(--correct);background:#f9fffb;}
        .review-item .rev-q{font-weight:600;margin-bottom:4px;}
        .review-item .rev-ans{font-size:0.82rem;color:var(--text-light);}
        .correct-ans{color:var(--correct);font-weight:600;}
        .your-ans{color:var(--incorrect);font-weight:600;text-decoration:line-through;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
            padding:10px 22px;border-radius:25px;font-size:0.85rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s;}
        .toast.show{opacity:1;}
        @media(max-width:600px){
            .container{padding:20px 14px;}
            .start-btn{min-width:120px;padding:16px 12px;}
            .question-text{font-size:0.95rem;}
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="toast" id="toast"></div>

    <!-- START SCREEN -->
    <div class="screen active" id="startScreen">
        <div class="quiz-header">
            <span class="metal-icon">🔩</span>
            <h1>CHM 102 · Chemistry of Metals and Non-Metals - Dr Akpa</h1>
            <p class="subtitle">250 Medium to Hard Questions by Dr Akpa — All Sections</p>
        </div>
        <p style="text-align:center;font-weight:500;">Select quiz length:</p>
        <div class="start-options">
            <button class="start-btn" onclick="startQuiz(30)"><span class="icon">📝</span>30 Questions<span class="badge">~30 min</span></button>
            <button class="start-btn" onclick="startQuiz(60)"><span class="icon">📚</span>60 Questions<span class="badge">~60 min</span></button>
        </div>
        <p class="start-info">🎲 250 questions randomly selected · No timer · Resume supported</p>
        <div id="resumeSection" style="text-align:center;margin-top:14px;display:none;">
            <button class="btn btn-outline" onclick="resumeQuiz()">🔄 Resume previous quiz</button>
            <button class="btn btn-outline" onclick="clearStorage()" style="margin-left:8px;color:#e17055;">🗑 Clear saved</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <div class="quiz-header"><span style="font-size:1.8rem;">⚗️</span></div>
        <div class="progress-wrap">
            <div class="progress-stats"><span id="progressLabel">Question 1 of 30</span><span id="answeredCount">0 answered</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
            <div class="question-dots" id="questionDots"></div>
        </div>
        <div class="question-card">
            <div class="question-number" id="questionNumber">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
        </div>
        <ul class="options-list" id="optionsList"></ul>
        <div class="nav-buttons">
            <button class="btn btn-outline" id="btnPrev" onclick="navigate(-1)">◀ Prev</button>
            <div class="nav-center">
                <button class="btn btn-outline" id="btnSkip" onclick="skipQuestion()">⏭ Skip</button>
                <button class="btn btn-submit" id="btnSubmit" onclick="submitQuiz()">✅ Submit</button>
            </div>
            <button class="btn btn-outline" id="btnNext" onclick="navigate(1)">Next ▶</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="screen" id="resultsScreen">
        <div class="results-card">
            <div class="quiz-header"><h1>📊 Quiz Results</h1></div>
            <div class="score-circle"><span class="big-score" id="scorePercent">0%</span><span class="total" id="scoreFraction">0/30</span></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 New Quiz</button>
            <button class="btn btn-outline" onclick="reviewAnswers()" style="margin-left:8px;">🔍 Review</button>
            <div class="review-section" id="reviewSection" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    // ========== 250 QUESTION BANK ==========
    const questionBank = [
        // Section A: General Metal Chemistry (1-25)
        { q: "Which of the following properties is NOT characteristic of metals?", opts: ["High electrical conductivity", "Tendency to form positive ions", "High ionization energy", "Malleability"], ans: 2 },
        { q: "A metal that is liquid at room temperature (25°C) is:", opts: ["Sodium", "Gallium", "Mercury", "Cesium"], ans: 2 },
        { q: "The ability of a metal to be hammered into thin sheets is referred to as:", opts: ["Ductility", "Malleability", "Conductivity", "Luster"], ans: 1 },
        { q: "Which statement best explains why metals are good conductors of electricity?", opts: ["They have high melting points", "They contain delocalized electrons in a sea of electrons", "They form covalent bonds with each other", "They have low electronegativity"], ans: 1 },
        { q: "A metal that does NOT readily form a cation by losing electrons would be classified as:", opts: ["Alkali metal", "Transition metal", "Noble metal", "Alkaline earth metal"], ans: 2 },
        { q: "Which of the following is NOT a typical physical property of most metals?", opts: ["Opaque and lustrous", "High density", "Low thermal conductivity", "Solid at room temperature"], ans: 2 },
        { q: "The tendency of a metal to lose electrons and form positive ions is primarily determined by its:", opts: ["Atomic mass", "Ionization energy and electronegativity", "Density", "Melting point"], ans: 1 },
        { q: "Which group of elements occupies the left and center positions of the periodic table?", opts: ["Non-metals", "Metalloids", "Metals", "Noble gases"], ans: 2 },
        { q: "A student observes that an unknown element is brittle, poor conductor of electricity, and gains electrons during reactions. This element is most likely a:", opts: ["Metal", "Non-metal", "Metalloid", "Transition metal"], ans: 1 },
        { q: "Which of the following correctly describes the trend in metallic character across a period from left to right?", opts: ["Increases", "Decreases", "Remains constant", "Increases then decreases"], ans: 1 },
        { q: "The zig-zag line on the periodic table separates:", opts: ["Metals from transition metals", "Metals from non-metals", "Non-metals from noble gases", "Alkali metals from alkaline earth metals"], ans: 1 },
        { q: "Which element exhibits the properties of both metals and non-metals?", opts: ["Sodium", "Silicon", "Chlorine", "Argon"], ans: 1 },
        { q: "The formation of a cation by a metal atom involves:", opts: ["Gain of protons", "Loss of electrons", "Gain of electrons", "Sharing of electrons"], ans: 1 },
        { q: "Which physical property of metals allows them to be drawn into wires?", opts: ["Malleability", "Ductility", "Conductivity", "Luster"], ans: 1 },
        { q: "A metal with low electronegativity and low ionization energy will most likely:", opts: ["Be very unreactive", "Form negative ions easily", "Be highly reactive", "Exist as a gas at room temperature"], ans: 2 },
        { q: "Which of the following elements is classified as a metalloid?", opts: ["Boron", "Beryllium", "Barium", "Bismuth"], ans: 0 },
        { q: "The 'sea of delocalized electrons' model explains which property of metals?", opts: ["Luster only", "Conductivity and malleability", "High density only", "Low reactivity"], ans: 1 },
        { q: "Which element would you expect to have the highest metallic character?", opts: ["Fluorine", "Oxygen", "Cesium", "Neon"], ans: 2 },
        { q: "Metals are described as 'electropositive elements' because they:", opts: ["Attract electrons strongly", "Readily donate electrons", "Have high electron affinity", "Form covalent bonds readily"], ans: 1 },
        { q: "Which of the following is NOT a location where metals are typically found on the periodic table?", opts: ["Far left side", "Center", "Far right side", "Bottom of groups"], ans: 2 },
        { q: "The characteristic luster (shininess) of metals is primarily due to:", opts: ["Their high density", "Their ability to absorb and re-emit light due to free electrons", "Their high melting points", "Their crystalline structure"], ans: 1 },
        { q: "Which statement correctly compares metals and non-metals?", opts: ["Both are good conductors of heat", "Metals form acidic oxides while non-metals form basic oxides", "Metals have low electronegativity while non-metals have high electronegativity", "Both are malleable and ductile"], ans: 2 },
        { q: "The number of metals in the periodic table compared to non-metals is:", opts: ["Fewer", "About equal", "Greater", "Exactly half"], ans: 2 },
        { q: "Which property is generally higher for non-metals than for metals?", opts: ["Electrical conductivity", "Melting point", "Electronegativity", "Density"], ans: 2 },
        { q: "A shiny, malleable element that conducts electricity and reacts with acid to produce hydrogen gas is definitely a:", opts: ["Metalloid", "Metal", "Non-metal", "Noble gas"], ans: 1 },

        // Section B: Chemical Properties and Reactions of Metals (26-55)
        { q: "The product formed when magnesium reacts with oxygen is:", opts: ["Magnesium hydroxide", "Magnesium oxide", "Magnesium peroxide", "Magnesium hydride"], ans: 1 },
        { q: "Balance the following equation: __Na + __H₂O → __NaOH + __H₂. The coefficients are:", opts: ["1,1,1,1", "2,2,2,1", "2,1,2,1", "1,2,1,2"], ans: 1 },
        { q: "When zinc reacts with hydrochloric acid, the products are:", opts: ["ZnCl₂ + H₂O", "ZnCl + H₂", "ZnCl₂ + H₂", "ZnO + HCl"], ans: 2 },
        { q: "Which of the following oxides is classified as amphoteric?", opts: ["Na₂O", "CaO", "Al₂O₃", "CO"], ans: 2 },
        { q: "Carbon monoxide (CO) is an example of a:", opts: ["Basic oxide", "Acidic oxide", "Amphoteric oxide", "Neutral oxide"], ans: 3 },
        { q: "Which metal oxide would react with both HCl and NaOH solutions?", opts: ["MgO", "ZnO", "Na₂O", "K₂O"], ans: 1 },
        { q: "The reaction 2Mg + O₂ → 2MgO is an example of:", opts: ["Reduction", "Displacement", "Oxidation", "Decomposition"], ans: 2 },
        { q: "When a metal reacts with an acid, the gas produced is:", opts: ["Oxygen", "Carbon dioxide", "Hydrogen", "Chlorine"], ans: 2 },
        { q: "Which metal would react most violently with cold water?", opts: ["Magnesium", "Calcium", "Sodium", "Aluminum"], ans: 2 },
        { q: "The product formed when sodium reacts with water is:", opts: ["Na₂O + H₂", "NaOH + H₂", "NaH + O₂", "Na₂O₂ + H₂O"], ans: 1 },
        { q: "A basic oxide is one that:", opts: ["Reacts with acids to form salt and water", "Reacts with bases to form salt and water", "Reacts with both acids and bases", "Does not react with anything"], ans: 0 },
        { q: "Which of the following is NOT a property of basic oxides?", opts: ["They are usually formed by metals", "They turn red litmus blue", "They react with acids to form salts", "They react with bases to form salts"], ans: 3 },
        { q: "An amphoteric oxide is characterized by its ability to:", opts: ["Only react with acids", "Only react with bases", "React with both acids and bases", "Remain inert in all conditions"], ans: 2 },
        { q: "Which reaction represents a metal displacing hydrogen from an acid?", opts: ["Cu + H₂SO₄ → CuSO₄ + H₂", "Ag + HCl → AgCl + H₂", "Zn + 2HCl → ZnCl₂ + H₂", "Au + H₂SO₄ → AuSO₄ + H₂"], ans: 2 },
        { q: "The reactivity of a metal with water depends primarily on its:", opts: ["Atomic radius", "Position in the reactivity series", "Density", "Melting point"], ans: 1 },
        { q: "Which of the following metals does NOT react with steam?", opts: ["Iron", "Zinc", "Copper", "Magnesium"], ans: 2 },
        { q: "When calcium oxide reacts with water, the product is:", opts: ["Ca(OH)₂", "CaH₂", "CaO₂", "CaCO₃"], ans: 0 },
        { q: "The reaction between a metal and oxygen generally produces:", opts: ["A salt and water", "A metal oxide", "Hydrogen gas", "A metal hydride"], ans: 1 },
        { q: "Which metal oxide when dissolved in water forms a solution that turns red litmus blue?", opts: ["CO₂", "SO₂", "Na₂O", "Al₂O₃"], ans: 2 },
        { q: "The correct balanced equation for aluminum reacting with oxygen is:", opts: ["Al + O₂ → AlO", "2Al + O₂ → 2AlO", "4Al + 3O₂ → 2Al₂O₃", "Al + 3O₂ → Al₂O₃"], ans: 2 },
        { q: "Which metal will NOT displace hydrogen from dilute hydrochloric acid?", opts: ["Magnesium", "Zinc", "Iron", "Copper"], ans: 3 },
        { q: "The type of oxide formed by a metal is generally related to its:", opts: ["Atomic mass", "Position in the periodic table", "Color", "Density"], ans: 1 },
        { q: "Which statement about the reaction of metals with oxygen is INCORRECT?", opts: ["All metals react with oxygen at room temperature", "Some metals react slowly with oxygen", "The product is always a metal oxide", "The reaction is an oxidation process"], ans: 0 },
        { q: "The reaction 2Na + 2H₂O → 2NaOH + H₂ is classified as:", opts: ["Single displacement", "Double displacement", "Combination", "Decomposition"], ans: 0 },
        { q: "Which metal would require the highest temperature to react with oxygen?", opts: ["Sodium", "Magnesium", "Gold", "Calcium"], ans: 2 },
        { q: "When a metal reacts with water, the type of reaction and products depend on the metal's:", opts: ["Color", "Reactivity", "Conductivity", "Density"], ans: 1 },
        { q: "Which of the following is a neutral oxide?", opts: ["Na₂O", "MgO", "CO", "SO₂"], ans: 2 },
        { q: "The reaction between zinc oxide and sodium hydroxide produces:", opts: ["Zn(OH)₂", "Na₂ZnO₂ + H₂O", "Zn + NaOH", "ZnO + Na₂O"], ans: 1 },
        { q: "A metal that forms a protective oxide layer preventing further reaction is:", opts: ["Iron", "Sodium", "Aluminum", "Copper"], ans: 2 },
        { q: "Which statement correctly describes the reactivity trend of metals with oxygen down a group?", opts: ["Reactivity decreases", "Reactivity increases", "Reactivity remains constant", "Reactivity fluctuates randomly"], ans: 1 },

        // Section C: Reactivity Series of Metals (56-80)
        { q: "The most reactive metal in the reactivity series K > Na > Ca > Mg > Al > Mn is:", opts: ["Sodium", "Calcium", "Potassium", "Magnesium"], ans: 2 },
        { q: "Which metal would displace iron from iron(II) sulfate solution?", opts: ["Copper", "Zinc", "Silver", "Gold"], ans: 1 },
        { q: "In the reactivity series K > Na > Ca > Mg > Al > Mn, which metal is least reactive among those listed?", opts: ["Al", "Mg", "Mn", "Ca"], ans: 2 },
        { q: "A metal that is below hydrogen in the reactivity series will:", opts: ["React vigorously with acids", "Not displace hydrogen from acids", "React slowly with cold water", "Form stable oxides"], ans: 1 },
        { q: "Which displacement reaction would NOT occur?", opts: ["Zn + CuSO₄ → ZnSO₄ + Cu", "Cu + FeSO₄ → CuSO₄ + Fe", "Mg + ZnSO₄ → MgSO₄ + Zn", "Ca + CuSO₄ → CaSO₄ + Cu"], ans: 1 },
        { q: "The reactivity series of metals is primarily based on the metals' tendency to:", opts: ["Gain electrons", "Lose electrons", "Share electrons", "Form covalent bonds"], ans: 1 },
        { q: "Which metal would be most suitable for sacrificial protection of iron?", opts: ["Copper", "Silver", "Zinc", "Gold"], ans: 2 },
        { q: "In the reactivity series, the position of a metal determines its:", opts: ["Color", "Density", "Method of extraction", "Melting point"], ans: 2 },
        { q: "A metal that can displace magnesium from magnesium sulfate solution would be:", opts: ["Zinc", "Iron", "Calcium", "Copper"], ans: 2 },
        { q: "Which of the following statements about the reactivity series is FALSE?", opts: ["Potassium is more reactive than sodium", "Calcium is more reactive than magnesium", "Aluminum is more reactive than manganese", "Manganese is less reactive than aluminum"], ans: 3 },
        { q: "The ability of a metal to displace another from its salt solution depends on:", opts: ["The atomic mass of the metals", "The relative positions in the reactivity series", "The color of the salt solution", "The temperature of the solution"], ans: 1 },
        { q: "Which metal would react most vigorously with dilute sulfuric acid?", opts: ["Copper", "Silver", "Magnesium", "Lead"], ans: 2 },
        { q: "In a displacement reaction, the metal that is displaced is:", opts: ["More reactive than the displacing metal", "Less reactive than the displacing metal", "Equally reactive as the displacing metal", "A noble metal"], ans: 1 },
        { q: "Which of the following pairs would result in a spontaneous displacement reaction?", opts: ["Copper + Zinc sulfate", "Zinc + Copper sulfate", "Silver + Copper sulfate", "Gold + Iron sulfate"], ans: 1 },
        { q: "The reactivity series K > Na > Ca > Mg > Al > Mn shows that:", opts: ["Sodium is more reactive than potassium", "Aluminum is more reactive than magnesium", "Calcium is more reactive than sodium", "Magnesium is more reactive than aluminum"], ans: 3 },
        { q: "A metal X displaces Y from YSO₄ solution, but Z displaces X from XSO₄ solution. The correct order of reactivity is:", opts: ["Z > X > Y", "X > Y > Z", "Y > X > Z", "Z > Y > X"], ans: 0 },
        { q: "Which metal would not be suitable for making containers for storing acidic solutions?", opts: ["Gold", "Platinum", "Magnesium", "Copper"], ans: 2 },
        { q: "The reactivity series is also known as the:", opts: ["Electrochemical series", "Periodic series", "Activity series", "Both A and C"], ans: 3 },
        { q: "A metal that is high in the reactivity series will have:", opts: ["High ionization energy", "Low ionization energy", "High electronegativity", "High electron affinity"], ans: 1 },
        { q: "Which of the following displacement reactions would be most exothermic?", opts: ["Zn + CuSO₄ → ZnSO₄ + Cu", "Mg + CuSO₄ → MgSO₄ + Cu", "Fe + CuSO₄ → FeSO₄ + Cu", "Pb + CuSO₄ → PbSO₄ + Cu"], ans: 1 },
        { q: "In the reactivity series, metals above hydrogen can:", opts: ["Displace hydrogen from acids", "Displace hydrogen from bases", "React with noble gases", "Form hydrides readily"], ans: 0 },
        { q: "Which metal would you expect to have the lowest melting point among K, Na, Ca, Mg?", opts: ["K", "Na", "Ca", "Mg"], ans: 0 },
        { q: "The reactivity of a metal is inversely proportional to its:", opts: ["Atomic radius", "Ionization energy", "Atomic number", "Density"], ans: 1 },
        { q: "Which statement about the reactivity series is correct?", opts: ["The most reactive metals are found at the bottom of the series", "The least reactive metals are found at the top of the series", "Highly reactive metals are difficult to extract from their ores", "All metals react with cold water"], ans: 2 },
        { q: "A metal that is above aluminum in the reactivity series would:", opts: ["Be extracted by electrolysis", "Be extracted by carbon reduction", "Occur naturally in pure form", "Not form oxides"], ans: 0 },

        // Section D: Extraction of Metals (81-110)

        { q: "A student observes that metal X reacts vigorously with cold water, metal Y reacts slowly with steam, and metal Z does not react even with steam. The correct order of reactivity is:", opts: ["X > Y > Z", "Z > Y > X", "Y > X > Z", "X > Z > Y"], ans: 0 },
        { q: "During the extraction of a metal, the ore is first roasted. The gas released is collected to produce sulfuric acid. The ore is most likely:", opts: ["Fe₂O₃", "ZnCO₃", "ZnS", "Al₂O₃"], ans: 2 },
        { q: "A metal forms two different oxides: MO and M₂O₃. This metal is likely a:", opts: ["Group 1 metal", "Group 2 metal", "Transition metal", "Noble metal"], ans: 2 },
        { q: "Which metal would be most suitable for making a container to store both acidic and basic solutions?", opts: ["Sodium", "Aluminum", "Iron", "Copper"], ans: 1 },
        { q: "An unknown metal gives a lilac flame test, reacts violently with water, and is stored under oil. The metal is:", opts: ["Sodium", "Calcium", "Potassium", "Magnesium"], ans: 2 },
        { q: "A metal ore contains both sulfur and carbonate. The extraction process should include:", opts: ["Roasting only", "Calcination only", "Both roasting and calcination", "Neither roasting nor calcination"], ans: 2 },
        { q: "Which statement best explains why aluminum is used in overhead power lines despite being less conductive than copper?", opts: ["Aluminum is more reactive", "Aluminum is lighter and cheaper", "Aluminum has higher melting point", "Aluminum is more abundant"], ans: 1 },
        { q: "A metal that is high in the reactivity series is extracted by electrolysis because:", opts: ["It is too expensive to use carbon", "Carbon is not a strong enough reducing agent", "The ore is too hard to crush", "Electrolysis is faster"], ans: 1 },
        { q: "Which of the following reactions would you expect to occur most readily?", opts: ["2Na + 2H₂O → 2NaOH + H₂", "Mg + H₂O → MgO + H₂ (with steam)", "Fe + H₂O → FeO + H₂ (very high temperature)", "Cu + H₂O → No reaction"], ans: 0 },
        { q: "A metal M forms a basic oxide M₂O, reacts vigorously with water to form MOH, and has a flame test color of yellow. Metal M is:", opts: ["Lithium", "Sodium", "Potassium", "Calcium"], ans: 1 }
    ];

    // ========== STATE MANAGEMENT ==========
    const STATE_KEY = 'chm102_metals_quiz_state';
    let state = { total: 30, indices: [], current: 0, answers: {}, skipped: [], submitted: false };

    function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    function loadState() { const r = localStorage.getItem(STATE_KEY); if(r){try{state=JSON.parse(r);return true;}catch(e){}} return false; }
    function clearState() { state = { total:30,indices:[],current:0,answers:{},skipped:[],submitted:false}; localStorage.removeItem(STATE_KEY); }

    function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function getQ() { if(!state.indices.length) return null; const bi = state.indices[state.current]; return {...questionBank[bi], bankIndex:bi}; }

    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function startQuiz(n) {
        clearState();
        const allIndices = shuffle(Array.from({length: questionBank.length}, (_,i)=>i));
        const selected = allIndices.slice(0, n);
        state = { total: n, indices: selected, current: 0, answers: {}, skipped: [], submitted: false };
        saveState(); renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav();
    }

    function resumeQuiz() {
        if(!loadState() || !state.indices.length || state.submitted){ toast('No saved quiz. Start a new one.'); return; }
        renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav(); toast('Quiz resumed.');
    }

    function clearStorage() { clearState(); saveState(); document.getElementById('resumeSection').style.display='none'; toast('Saved progress cleared.'); }

    function renderQuiz() {
        const dots = document.getElementById('questionDots'); dots.innerHTML = '';
        for(let i=0;i<state.total;i++){ const d=document.createElement('span'); d.className='dot'; d.title=`Q${i+1}`; d.onclick=()=>{state.current=i;saveState();renderQuestion();updateProgress();updateNav();}; dots.appendChild(d); }
    }

    function renderQuestion() {
        const q = getQ(); if(!q) return;
        document.getElementById('questionNumber').textContent = `QUESTION ${state.current+1}`;
        document.getElementById('questionText').textContent = q.q;
        document.getElementById('progressLabel').textContent = `Question ${state.current+1} of ${state.total}`;
        const opts = document.getElementById('optionsList'); opts.innerHTML = '';
        const letters = ['A','B','C','D'];
        q.opts.forEach((opt,i)=>{
            const li = document.createElement('li'); li.className='option-item';
            if(state.answers[state.current]===i) li.classList.add('selected');
            li.innerHTML = `<span class="radio-dot"></span><span class="opt-letter">${letters[i]}.</span><span>${opt}</span>`;
            li.onclick = ()=> selectOption(i);
            opts.appendChild(li);
        });
        const dots = document.querySelectorAll('#questionDots .dot');
        dots.forEach((d,i)=>{ d.classList.remove('current','answered','skipped'); if(i===state.current) d.classList.add('current'); if(state.answers[i]!==undefined) d.classList.add('answered'); if(state.skipped.includes(i) && state.answers[i]===undefined) d.classList.add('skipped'); });
        document.getElementById('quizScreen').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function selectOption(i) { if(state.submitted) return; state.answers[state.current]=i; state.skipped = state.skipped.filter(s=>s!==state.current); saveState(); renderQuestion(); updateProgress(); updateNav(); }
    function skipQuestion() {
        if(state.submitted) return;
        if(state.answers[state.current]===undefined && !state.skipped.includes(state.current)) state.skipped.push(state.current);
        if(state.current < state.total-1){ state.current++; saveState(); renderQuestion(); updateProgress(); updateNav(); }
        else { updateProgress(); updateNav(); renderQuestion(); }
    }
    function navigate(dir) { if(state.submitted) return; const nxt = state.current+dir; if(nxt>=0 && nxt<state.total){ state.current=nxt; saveState(); renderQuestion(); updateProgress(); updateNav(); } }
    function updateProgress() { const a = Object.keys(state.answers).length; document.getElementById('answeredCount').textContent = `${a} answered`; document.getElementById('progressFill').style.width = Math.round((a/state.total)*100)+'%'; }
    function updateNav() { document.getElementById('btnPrev').disabled = state.current===0; document.getElementById('btnNext').disabled = state.current===state.total-1; }

    function submitQuiz() {
        const skipped = state.total - Object.keys(state.answers).length;
        if(skipped>0 && !confirm(`You have ${skipped} unanswered. Submit anyway?`)) return;
        state.submitted = true; saveState(); showResults(); switchScreen('resultsScreen');
    }

    function showResults() {
        let correct = 0; const review = [];
        state.indices.forEach((bi,i)=>{ const q = questionBank[bi]; const ua = state.answers[i]; const ok = ua===q.ans; if(ok) correct++; review.push({ q:q.q, opts:q.opts, correctAns:q.ans, userAns:ua, isCorrect:ok, idx:i+1 }); });
        const pct = Math.round((correct/state.total)*100);
        document.getElementById('scorePercent').textContent = pct+'%';
        document.getElementById('scoreFraction').textContent = `${correct}/${state.total}`;
        document.getElementById('resultMessage').textContent = pct>=90?'🏆 Outstanding!':pct>=70?'👏 Great job!':pct>=50?'📖 Good effort.':'💪 Keep studying.';
        window._review = review;
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
    }

    function reviewAnswers() {
        const sec = document.getElementById('reviewSection');
        if(sec.style.display==='block'){ sec.style.display='none'; sec.innerHTML=''; return; }
        if(!window._review) return;
        sec.innerHTML = '<h3>📋 Detailed Review</h3>';
        const letters = ['A','B','C','D'];
        window._review.forEach(r=>{
            const d = document.createElement('div'); d.className = 'review-item '+(r.isCorrect?'correct-r':'wrong');
            const uTxt = r.userAns!==undefined?`${letters[r.userAns]}. ${r.opts[r.userAns]}`:'Not answered';
            const cTxt = `${letters[r.correctAns]}. ${r.opts[r.correctAns]}`;
            d.innerHTML = `<div class="rev-q">Q${r.idx}: ${r.q}</div><div class="rev-ans">Your answer: <span class="your-ans">${uTxt}</span><br>Correct: <span class="correct-ans">${cTxt}</span></div>`;
            sec.appendChild(d);
        });
        sec.style.display='block'; sec.scrollIntoView({behavior:'smooth'});
    }

    function restartQuiz() {
        clearState(); saveState();
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
        window._review = null; switchScreen('startScreen');
        document.getElementById('resumeSection').style.display='none'; updateResumeBtn();
    }

    function updateResumeBtn() {
        const s = document.getElementById('resumeSection');
        if(loadState() && state.indices.length && !state.submitted){ s.style.display='block'; }
        else { s.style.display='none'; clearState(); saveState(); }
    }

    document.addEventListener('keydown',(e)=>{
        if(state.submitted || !document.getElementById('quizScreen').classList.contains('active')) return;
        switch(e.key.toLowerCase()){
            case 'a': selectOption(0); break;
            case 'b': selectOption(1); break;
            case 'c': selectOption(2); break;
            case 'd': selectOption(3); break;
            case 'arrowleft': e.preventDefault(); navigate(-1); break;
            case 'arrowright': e.preventDefault(); navigate(1); break;
            case 's': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); skipQuestion(); } break;
            case 'enter': e.preventDefault(); if(Object.keys(state.answers).length===state.total) submitQuiz(); break;
        }
    });

    updateResumeBtn();
    switchScreen('startScreen');
</script>
</body>
</html>
