<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET 102 · Design Thinking & Engineering Graphics Quiz</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --primary-dark: #1a252f;
            --accent: #1a1a2e;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --correct: #00b894;
            --incorrect: #e17055;
            --warning: #fdcb6e;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.3s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',Inter,system-ui,sans-serif;
            background:var(--bg);min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            padding:20px;line-height:1.6;color:var(--text);
        }
        .container{
            width:100%;max-width:850px;background:var(--card-bg);
            border-radius:var(--radius);box-shadow:var(--shadow);
            padding:32px 28px;position:relative;overflow:hidden;transition:var(--transition);
        }
        .quiz-header{text-align:center;margin-bottom:20px;}
        .quiz-header .eng-icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .quiz-header h1{font-size:1.5rem;color:var(--primary-dark);font-weight:700;}
        .subtitle{font-size:0.85rem;color:var(--text-light);margin-top:4px;}
        .screen{display:none;animation:fadeIn 0.4s;}
        .screen.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
        .start-options{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0 18px;}
        .start-btn{
            flex:1;min-width:150px;padding:22px 16px;border:2px solid var(--border);
            border-radius:var(--radius);background:var(--card-bg);cursor:pointer;
            text-align:center;font-weight:600;transition:var(--transition);color:var(--text);
        }
        .start-btn:hover{border-color:var(--primary);box-shadow:0 8px 20px rgba(44,62,80,0.12);transform:translateY(-2px);}
        .start-btn .icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .start-btn .badge{background:var(--primary);color:#fff;font-size:0.75rem;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:6px;}
        .start-info{font-size:0.8rem;color:var(--text-light);text-align:center;}
        .progress-wrap{margin-bottom:16px;}
        .progress-stats{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-light);margin-bottom:4px;}
        .progress-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#5d7b93);border-radius:10px;transition:width 0.4s;}
        .question-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
        .dot{width:10px;height:10px;border-radius:50%;background:var(--border);cursor:pointer;transition:var(--transition);}
        .dot.answered{background:var(--primary);opacity:0.6;}
        .dot.current{background:var(--primary);transform:scale(1.5);box-shadow:0 0 0 4px rgba(44,62,80,0.2);}
        .dot.skipped{background:var(--warning);}
        .question-card{background:#fafbfc;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid var(--border);}
        .question-number{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--primary);font-weight:700;margin-bottom:6px;}
        .question-text{font-size:1.05rem;font-weight:600;color:var(--text);}
        .options-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px;}
        .option-item{
            padding:14px 16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;
            display:flex;align-items:center;gap:10px;transition:var(--transition);font-size:0.95rem;user-select:none;
        }
        .option-item:hover{border-color:#b2bec3;background:#f8f9fa;}
        .option-item.selected{border-color:var(--primary);background:#e9ecef;font-weight:600;}
        .option-item .radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
            display:flex;align-items:center;justify-content:center;transition:var(--transition);}
        .option-item.selected .radio-dot{border-color:var(--primary);background:var(--primary);}
        .option-item.selected .radio-dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%;}
        .option-item .opt-letter{font-weight:700;color:var(--primary);width:24px;}
        .nav-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px;}
        .btn{padding:11px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:600;font-size:0.9rem;
            transition:var(--transition);display:inline-flex;align-items:center;gap:6px;}
        .btn-outline{background:#fff;border:2px solid var(--border);color:var(--text);}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
        .btn-primary{background:var(--primary);color:#fff;border:2px solid var(--primary);}
        .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn-submit{background:var(--accent);color:#fff;border:2px solid var(--accent);font-size:1rem;padding:13px 32px;}
        .btn-submit:hover{background:#2d2d4e;}
        .btn:disabled{opacity:0.5;pointer-events:none;}
        .results-card{text-align:center;}
        .score-circle{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;
            justify-content:center;flex-direction:column;border:6px solid var(--primary);font-weight:700;}
        .score-circle .big-score{font-size:2.8rem;color:var(--primary);}
        .score-circle .total{font-size:0.9rem;color:var(--text-light);}
        .result-message{font-size:1.1rem;margin-bottom:20px;font-weight:500;}
        .review-section{text-align:left;margin-top:24px;max-height:400px;overflow-y:auto;padding-right:8px;}
        .review-item{background:#fafbfc;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border);font-size:0.9rem;}
        .review-item.wrong{border-left-color:var(--incorrect);background:#fffaf9;}
        .review-item.correct-r{border-left-color:var(--correct);background:#f9fffb;}
        .review-item .rev-q{font-weight:600;margin-bottom:4px;}
        .review-item .rev-ans{font-size:0.82rem;color:var(--text-light);}
        .correct-ans{color:var(--correct);font-weight:600;}
        .your-ans{color:var(--incorrect);font-weight:600;text-decoration:line-through;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
            padding:10px 22px;border-radius:25px;font-size:0.85rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s;}
        .toast.show{opacity:1;}
        @media(max-width:600px){
            .container{padding:20px 14px;}
            .start-btn{min-width:120px;padding:16px 12px;}
            .question-text{font-size:0.95rem;}
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="toast" id="toast"></div>

    <!-- START SCREEN -->
    <div class="screen active" id="startScreen">
        <div class="quiz-header">
            <span class="eng-icon">✏️</span>
            <h1>GET 102 · Design Thinking & Engineering Graphics</h1>
            <p class="subtitle">200 Medium to Hard Questions — Design Thinking, Graphics & AutoCAD</p>
        </div>
        <p style="text-align:center;font-weight:500;">Select quiz length:</p>
        <div class="start-options">
            <button class="start-btn" onclick="startQuiz(30)"><span class="icon">📝</span>30 Questions<span class="badge">~30 min</span></button>
            <button class="start-btn" onclick="startQuiz(60)"><span class="icon">📚</span>60 Questions<span class="badge">~60 min</span></button>
        </div>
        <p class="start-info">🎲 Questions randomly selected · No timer · Resume supported</p>
        <div id="resumeSection" style="text-align:center;margin-top:14px;display:none;">
            <button class="btn btn-outline" onclick="resumeQuiz()">🔄 Resume previous quiz</button>
            <button class="btn btn-outline" onclick="clearStorage()" style="margin-left:8px;color:#e17055;">🗑 Clear saved</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <div class="quiz-header"><span style="font-size:1.8rem;">📐</span></div>
        <div class="progress-wrap">
            <div class="progress-stats"><span id="progressLabel">Question 1 of 30</span><span id="answeredCount">0 answered</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
            <div class="question-dots" id="questionDots"></div>
        </div>
        <div class="question-card">
            <div class="question-number" id="questionNumber">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
        </div>
        <ul class="options-list" id="optionsList"></ul>
        <div class="nav-buttons">
            <button class="btn btn-outline" id="btnPrev" onclick="navigate(-1)">◀ Prev</button>
            <div class="nav-center">
                <button class="btn btn-outline" id="btnSkip" onclick="skipQuestion()">⏭ Skip</button>
                <button class="btn btn-submit" id="btnSubmit" onclick="submitQuiz()">✅ Submit</button>
            </div>
            <button class="btn btn-outline" id="btnNext" onclick="navigate(1)">Next ▶</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="screen" id="resultsScreen">
        <div class="results-card">
            <div class="quiz-header"><h1>📊 Quiz Results</h1></div>
            <div class="score-circle"><span class="big-score" id="scorePercent">0%</span><span class="total" id="scoreFraction">0/30</span></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 New Quiz</button>
            <button class="btn btn-outline" onclick="reviewAnswers()" style="margin-left:8px;">🔍 Review</button>
            <div class="review-section" id="reviewSection" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    // ========== 200 QUESTION BANK ==========
    const questionBank = [
        // Design Thinking (Q1-Q122)
        { q: "According to the text, design thinking has evolved from a profession into a novel approach that helps people solve challenges in a more creative, human-centred, collaborative, iterative and _____ way.", opts: ["Linear", "Visual", "Theoretical", "Isolated"], ans: 1 },
        { q: "What is the biggest difference between design thinking and classical design, according to the text?", opts: ["The use of digital tools", "The focus on profit", "The collaborative and multidisciplinary approach", "The length of the project timeline"], ans: 2 },
        { q: "How does the text distinguish 'cooperation' from 'collaboration' in a team setting?", opts: ["Cooperation is faster; collaboration is slower.", "Cooperation involves shared goals; collaboration does not.", "In cooperation, members are not necessarily involved in all steps; in collaboration, they ideally work and decide together on all steps.", "Cooperation is for small teams; collaboration is for large teams."], ans: 2 },
        { q: "The three core elements of design thinking, as mentioned in the text, are: people, process, and _____.", opts: ["Profit", "Place", "Prototype", "Product"], ans: 1 },
        { q: "The term that can be used almost synonymously with design thinking is:", opts: ["User-led design", "Human-centred design", "Agile development", "Systems thinking"], ans: 1 },
        { q: "The concept of the 'T-shaped person' describes a team member who has:", opts: ["Deep expertise in many fields (the top of the T) and no specific specialization.", "Deep expertise in one field (vertical line) and the ability to collaborate across disciplines (horizontal line).", "A managerial role overseeing both technical and creative staff.", "An equal balance of theory and practical skills."], ans: 1 },
        { q: "In the 'T-shaped person' model, the horizontal line symbolizes:", opts: ["The depth of expertise in a single domain", "The number of years of experience", "The ability and willingness to reach out to others and bridge disciplinary gaps", "The breadth of the project scope"], ans: 2 },
        { q: "According to the text, what attitude is generally required of design thinking team members?", opts: ["Authoritative and decisive", "Risk-averse and cautious", "Open, curious, and empathetic", "Competitive and individualistic"], ans: 2 },
        { q: "If an organization lacks diversity in expertise, what does the text suggest doing?", opts: ["Abandon the design thinking approach", "Only hire new, diverse staff", "Embrace diversity on other levels, such as character or working style, and bring in other perspectives during the project", "Focus only on the experts available within the team"], ans: 2 },
        { q: "Besides the target audience, who else does a design thinker try to understand?", opts: ["Only direct competitors", "Other important stakeholders (e.g., fathers who might oppose girls' education)", "Government regulators only", "Future employees of the organization"], ans: 1 },
        { q: "What type of research does the text recommend to understand the system in which a design team is operating?", opts: ["Quantitative survey research", "Ethnographic research", "Desk research of existing reports", "A/B testing"], ans: 1 },
        { q: "For a design thinking workspace, the text advocates for:", opts: ["Fixed, heavy furniture to maintain order", "A flexible space where the team can move furniture as needed", "Individual cubicles to minimize distraction", "A traditional conference room with a large, fixed table"], ans: 1 },
        { q: "Why might an organization look for an approach like design thinking?", opts: ["To reduce costs by 10%", "To follow a new management fad", "The need for innovation", "To eliminate the need for user research"], ans: 2 },
        { q: "What challenge do teams new to design thinking face, regarding the process?", opts: ["They want to spend too much time on prototyping.", "They feel uncomfortable not knowing where the process will lead them.", "They find it too structured and rigid.", "They prefer to work individually rather than in teams."], ans: 1 },
        { q: "An experienced design thinker will 'trust the process' because:", opts: ["It guarantees a profitable outcome.", "It is a very short and simple process.", "They have seen it work many times before.", "They are required to by the project sponsor."], ans: 2 },
        { q: "The text defines the 'Empathize mode' as the work you do to:", opts: ["Brainstorm as many ideas as possible", "Build and test your solutions", "Understand people within the context of your design challenge", "Define the technical specifications of a product"], ans: 2 },
        { q: "According to the text, why is empathy crucial for a design thinker?", opts: ["It is the cheapest part of the design process.", "The problems are rarely your own; they belong to a particular group of people you need to understand.", "It is the only way to secure funding for a project.", "It replaces the need for prototyping."], ans: 1 },
        { q: "Observing what people do and how they interact with their environment helps you learn about:", opts: ["Their exact budget for a solution", "What they think, feel, and need", "Their political affiliations", "Their preferred brand of technology"], ans: 1 },
        { q: "The text states that the best solutions come from:", opts: ["The most advanced technology", "The largest budget", "The best insights into human behavior", "The strictest project deadlines"], ans: 2 },
        { q: "Why is learning to recognize insights difficult?", opts: ["Insights are always obvious to everyone.", "Our minds automatically filter out a lot of information without us realizing it.", "There is too much data available.", "Users always lie about their experiences."], ans: 1 },
        { q: "Engaging with people directly reveals a tremendous amount about:", opts: ["The most efficient manufacturing process", "Their financial status", "The way they think and the values they hold", "The exact solution they want"], ans: 2 },
        { q: "What can a good conversation reveal that might surprise both the designer and the subject?", opts: ["The subject's salary", "Unanticipated insights", "The designer's personal opinions", "The exact timeline for a project"], ans: 1 },
        { q: "The stories people tell, even if different from what they actually do, are strong indicators of:", opts: ["Their level of intelligence", "Their deeply held beliefs about the way the world is", "Their education level", "Their preferred social media platform"], ans: 1 },
        { q: "What is a powerful realization that can come from observing users?", opts: ["How much money they have", "A disconnect between what someone says and what he does", "Their favorite color", "The brand of their clothing"], ans: 1 },
        { q: "When engaging or interviewing users, what should you always ask to uncover deeper meaning?", opts: ["\"How much would you pay?\"", "\"Why?\"", "\"Who told you that?\"", "\"Is this the best solution?\""], ans: 1 },
        { q: "The 'Unpack' transition from Empathize to Define is a chance to:", opts: ["Discard all the data that doesn't make sense", "Write the final report", "Share findings, capture important parts visually, and start making connections", "Move directly to prototyping"], ans: 2 },
        { q: "The goal of the 'Define' mode is to craft a meaningful and actionable:", opts: ["Prototype", "Budget", "Problem statement (point-of-view)", "Marketing plan"], ans: 2 },
        { q: "In one word, the text describes the 'Define' mode as:", opts: ["Brainstorming", "Prototyping", "Sensemaking", "Testing"], ans: 2 },
        { q: "A well-scoped point-of-view (POV) should naturally lead into which mode?", opts: ["Empathize", "Define", "Ideate", "Test"], ans: 2 },
        { q: "What is a great litmus test for your point-of-view?", opts: ["A financial projection", "Whether brainstorming topics (How-Might-We questions) fall out of it", "A user's initial reaction", "A manager's approval"], ans: 1 },
        { q: "What type of brainstorming topics flow from a problem statement?", opts: ["\"What if we...\"", "\"We should definitely...\"", "\"How-Might-We...?\"", "\"Why don't they...?\""], ans: 2 },
        { q: "You ideate in order to transition from identifying problems to:", opts: ["Securing funding", "Creating solutions for your users", "Hiring a design team", "Writing a report"], ans: 1 },
        { q: "Early in a design project, ideation is about:", opts: ["Finding a single, best solution quickly", "Pushing for the widest possible range of ideas", "Validating an existing idea", "Creating a detailed project plan"], ans: 1 },
        { q: "How is the best solution determined in the design thinking process?", opts: ["By the team leader's vote", "By the client's initial preference", "Later, through user testing and feedback", "It is determined during the ideation phase"], ans: 2 },
        { q: "To avoid losing innovation potential, the text recommends a process of:", opts: ["Selecting only the cheapest idea", "Considered selection, bringing multiple ideas forward into prototyping", "Voting on a single idea to develop", "Discarding all but one concept"], ans: 1 },
        { q: "What three voting criteria does the text suggest for selecting ideas to prototype?", opts: ["The cheapest, the fastest, the easiest", "The most likely to delight, the rational choice, the most unexpected", "The most complex, the most simple, the most colorful", "The safest, the most popular, the most technical"], ans: 1 },
        { q: "Why is it a good idea to carry two or three ideas forward into prototyping?", opts: ["To confuse the users", "To increase the budget", "To preserve innovation potential", "To make the team work harder"], ans: 2 },
        { q: "Which two modes should be considered in tandem more than as a simple transition?", opts: ["Empathize and Define", "Define and Ideate", "Ideate and Prototype", "Prototype and Test"], ans: 3 },
        { q: "What is critically important to consider before you create a prototype?", opts: ["What you are trying to test and how you will test it", "The color scheme of the prototype", "The exact manufacturing cost", "The patent status of the idea"], ans: 0 },
        { q: "Planning and executing a successful testing scenario is often:", opts: ["A trivial and quick step", "Unnecessary if the prototype is good", "A considerable additional step after creating a prototype", "The same as creating the prototype"], ans: 2 },
        { q: "In the Test mode, what should you focus on besides whether people like your solution?", opts: ["How to sell the solution", "What you can learn about the person, the problem, and your potential solutions", "How to defend your solution", "The manufacturing timeline"], ans: 1 },
        { q: "The text suggests that a design-thinking team should ideally be diverse in terms of:", opts: ["Age only", "Gender, backgrounds, and skills", "Political opinions only", "Height and weight"], ans: 1 },
        { q: "An example of a diverse design thinking team given in the text includes an engineer, a social worker, a designer, a philosopher, and:", opts: ["A lawyer", "A business expert", "A doctor", "A politician"], ans: 1 },
        { q: "Maintaining a good team spirit in design thinking involves:", opts: ["Strict performance reviews", "Exchanging constantly about behavior, feelings, and emotions, and playing games", "Avoiding any social interaction outside of work", "Focusing solely on the task at hand"], ans: 1 },
        { q: "Instead of 'users' in the context of social activism, the text suggests terms like:", opts: ["Consumers or buyers", "Audience or just person/human being", "Subjects or test cases", "Clients or patients"], ans: 1 },
        { q: "Ethnographic research involves:", opts: ["Analyzing large datasets from surveys", "Constant interaction with people affected by or causing the problem", "Conducting laboratory experiments", "Reading academic papers on the topic"], ans: 1 },
        { q: "According to the text, traditional offices with heavy furniture and strict policies are problematic because they:", opts: ["Are too expensive", "Constrain the team and destroy flexibility", "Are too large for small teams", "Have poor lighting"], ans: 1 },
        { q: "The little word 'new' in the definition of design thinking carries importance because:", opts: ["Old solutions are always bad", "The need for innovation is the reason many organizations use design thinking", "New solutions are always more expensive", "It is a legal requirement"], ans: 1 },
        { q: "Why is it that a team cannot know the exact outcome at the outset of a design thinking project?", opts: ["The team is not smart enough", "That is the whole point of the exercise – to discover the solution", "The project sponsor hides the goal", "Technology is not advanced enough"], ans: 1 },
        { q: "According to the text, design thinking is especially helpful when challenges are:", opts: ["Very simple and have one clear solution", "Rather complex in nature and could be solved in many different ways", "Already solved by a competitor", "Purely mathematical in nature"], ans: 1 },
        { q: "What do many process visualizations of design thinking on the internet help teams with?", opts: ["Avoiding any form of research", "Being mindful of the process to ensure proper collaboration and avoid getting lost", "Skipping the prototyping phase", "Working individually instead of in teams"], ans: 1 },
        { q: "At the beginning of a design thinking project, the team might feel lost, but through broad research they will eventually:", opts: ["Give up on the project", "Find patterns, reach insights, and develop ideas", "Realize they need more budget", "Decide to copy a competitor's product"], ans: 1 },
        { q: "Empathy is described as the _____ of a human-centered design process.", opts: ["Final step", "Most expensive part", "Centerpiece", "Least important part"], ans: 2 },
        { q: "By watching people, you can capture physical manifestations of their experiences, which allows you to:", opts: ["Judge their character", "Infer the intangible meaning of those experiences to uncover insights", "Predict their future behavior perfectly", "Determine their income level"], ans: 1 },
        { q: "To empathize, you must observe users in the context of their lives. According to the text, why is this important?", opts: ["It is easier for the researcher", "Some of the most powerful realizations come from noticing a disconnect between what someone says and does", "It requires less equipment", "Users are more comfortable in their homes"], ans: 1 },
        { q: "What is a 'work-around' that a user has created, according to the text?", opts: ["A deliberate attempt to mislead the designer", "An efficient solution to a problem that the user might not even think to mention", "A feature of the product being tested", "A sign that the user is uncooperative"], ans: 1 },
        { q: "The suggested 'engagement' technique is described as feeling more like a conversation. What should you do with your prepared questions?", opts: ["Never deviate from them", "Read them out loud exactly as written", "Expect to let the conversation deviate from them", "Only ask yes/no questions"], ans: 2 },
        { q: "In addition to asking 'Why?', what should you elicit from the people you talk to?", opts: ["Their exact age", "Stories", "Their employment history", "Their future plans"], ans: 1 },
        { q: "What does the text suggest you do when someone shows you how they complete a task?", opts: ["Remain silent and take notes", "Have them vocalize what's going through their mind as they perform the task", "Take over and do it yourself", "Suggest a better way to do it immediately"], ans: 1 },
        { q: "During the 'Unpack' phase, what should you do with the information you've gathered?", opts: ["Keep it in your head to avoid bias", "File it away in a secure folder", "Get it out of your head and onto a wall (e.g., using post-its, pictures) to make connections", "Summarize it in a one-page memo"], ans: 2 },
        { q: "The transition from Empathize to Define involves a synthesis process, which leads to:", opts: ["A final product", "A 'Define' mode", "User testing", "Project completion"], ans: 1 },
        { q: "The 'Define' mode is about crafting a problem statement. This statement is also called a:", opts: ["Mission statement", "Value proposition", "Point-of-view", "Business case"], ans: 2 },
        { q: "According to the text, insights don't often just jump in your lap; rather, they emerge from:", opts: ["A sudden flash of genius", "A process of synthesizing information to discover connections and patterns", "Reading a book on creativity", "Copying what competitors are doing"], ans: 1 },
        { q: "A well-articulated point-of-view will lead you into the Ideate mode in a very natural way. What does this mean?", opts: ["The POV acts as a strict constraint.", "The POV should be so clear that brainstorming topics flow from it organically.", "The POV replaces the need for ideation.", "The POV is the final idea."], ans: 1 },
        { q: "'How-Might-We' (HMW) questions are created during the transition from:", opts: ["Test to Empathize", "Prototype to Test", "Define to Ideate", "Ideate to Prototype"], ans: 2 },
        { q: "The ideation phase is your chance to combine your understanding of the problem space with your _____ to generate solution concepts.", opts: ["Budget", "Imagination", "Manager's preferences", "Time constraints"], ans: 1 },

        { q: "To create a line that is perfectly tangent to two circles in AutoCAD, which command or object snap combination would be most direct?", opts: ["LINE command with TAN object snap to both circles", "XLINE command", "RAY command", "MLINE command with a tangency property"], ans: 0 },
        { q: "In AutoCAD, the TRIM command can be used to cut a line precisely at an intersection with another line. What is the first thing you must select when using the TRIM command?", opts: ["The object(s) to be trimmed", "The cutting edge(s)", "An empty space to select all", "The undo option"], ans: 1 },
        { q: "Which AutoCAD command would you use to join two collinear lines that have a small gap between them into a single line segment?", opts: ["JOIN (or J)", "MERGE", "UNITE", "CONNECT"], ans: 0 },
        { q: "What does the AutoCAD system variable LINETYPE control?", opts: ["The color of the line", "The pattern of the line (e.g., dashed, dotted, center)", "The width of the line", "The layer of the line"], ans: 1 },
        { q: "In AutoCAD, the OFFSET command is used to create a parallel copy of a line. What is required to use this command successfully?", opts: ["A distance value", "A scale factor", "A rotation angle", "A mirror axis"], ans: 0 },
        { q: "Which object snap override (OSNAP) would you use to draw a line starting exactly at the midpoint of another line?", opts: ["END", "INT", "MID", "CEN"], ans: 2 },
        { q: "If you need to draw a construction line that extends infinitely in both directions, which command would you use?", opts: ["LINE", "RAY", "XLINE", "PLINE"], ans: 2 },
        { q: "In the context of basic line commands, what is the primary difference between a RAY and an XLINE in AutoCAD?", opts: ["A RAY extends infinitely in one direction from a point; an XLINE extends infinitely in both directions.", "An XLINE can be trimmed; a RAY cannot.", "A RAY is a type of polyline; an XLINE is not.", "There is no difference."], ans: 0 },
        { q: "When drawing a line in AutoCAD using the LINE command, how can you undo the very last segment you drew without canceling the entire command?", opts: ["Press Ctrl+Z", "Type U and press Enter", "Press the Esc key", "Type UNDO and press Enter twice"], ans: 1 },
        { q: "In an engineering drawing, a dashed/dotted line typically represents a feature that is:", opts: ["Visible", "Hidden or behind another surface", "A center of a circle", "A cutting plane"], ans: 1 },
        { q: "What is the name of the standard line type used to indicate the center of a circle or arc in both manual drafting and AutoCAD?", opts: ["Hidden line", "Phantom line", "Center line", "Section line"], ans: 2 },
        { q: "In AutoCAD, the FILLET command with a radius of 0 is often used to:", opts: ["Create a smooth curved corner", "Sharpen a corner to a point", "Join two lines that intersect or would intersect, making a sharp corner and trimming the excess", "Create a chamfer"], ans: 2 },
        { q: "To accurately draw a line from the endpoint of one line perpendicular to another existing line, you would use the LINE command and which combination of object snaps?", opts: ["END then PER", "NEA then INT", "MID then QUA", "CEN then TAN"], ans: 0 }
    ];

    // ========== STATE MANAGEMENT ==========
    const STATE_KEY = 'get102_quiz_state';
    let state = { total: 30, indices: [], current: 0, answers: {}, skipped: [], submitted: false };

    function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    function loadState() { const r = localStorage.getItem(STATE_KEY); if(r){try{state=JSON.parse(r);return true;}catch(e){}} return false; }
    function clearState() { state = { total:30,indices:[],current:0,answers:{},skipped:[],submitted:false}; localStorage.removeItem(STATE_KEY); }

    function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function getQ() { if(!state.indices.length) return null; const bi = state.indices[state.current]; return {...questionBank[bi], bankIndex:bi}; }

    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function startQuiz(n) {
        clearState();
        const allIndices = shuffle(Array.from({length: questionBank.length}, (_,i)=>i));
        const selected = allIndices.slice(0, Math.min(n, questionBank.length));
        state = { total: selected.length, indices: selected, current: 0, answers: {}, skipped: [], submitted: false };
        saveState(); renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav();
    }

    function resumeQuiz() {
        if(!loadState() || !state.indices.length || state.submitted){ toast('No saved quiz. Start a new one.'); return; }
        renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav(); toast('Quiz resumed.');
    }

    function clearStorage() { clearState(); saveState(); document.getElementById('resumeSection').style.display='none'; toast('Saved progress cleared.'); }

    function renderQuiz() {
        const dots = document.getElementById('questionDots'); dots.innerHTML = '';
        for(let i=0;i<state.total;i++){ const d=document.createElement('span'); d.className='dot'; d.title=`Q${i+1}`; d.onclick=()=>{state.current=i;saveState();renderQuestion();updateProgress();updateNav();}; dots.appendChild(d); }
    }

    function renderQuestion() {
        const q = getQ(); if(!q) return;
        document.getElementById('questionNumber').textContent = `QUESTION ${state.current+1}`;
        document.getElementById('questionText').textContent = q.q;
        document.getElementById('progressLabel').textContent = `Question ${state.current+1} of ${state.total}`;
        const opts = document.getElementById('optionsList'); opts.innerHTML = '';
        const letters = ['A','B','C','D'];
        q.opts.forEach((opt,i)=>{
            const li = document.createElement('li'); li.className='option-item';
            if(state.answers[state.current]===i) li.classList.add('selected');
            li.innerHTML = `<span class="radio-dot"></span><span class="opt-letter">${letters[i]}.</span><span>${opt}</span>`;
            li.onclick = ()=> selectOption(i);
            opts.appendChild(li);
        });
        const dots = document.querySelectorAll('#questionDots .dot');
        dots.forEach((d,i)=>{ d.classList.remove('current','answered','skipped'); if(i===state.current) d.classList.add('current'); if(state.answers[i]!==undefined) d.classList.add('answered'); if(state.skipped.includes(i) && state.answers[i]===undefined) d.classList.add('skipped'); });
        document.getElementById('quizScreen').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function selectOption(i) { if(state.submitted) return; state.answers[state.current]=i; state.skipped = state.skipped.filter(s=>s!==state.current); saveState(); renderQuestion(); updateProgress(); updateNav(); }
    function skipQuestion() {
        if(state.submitted) return;
        if(state.answers[state.current]===undefined && !state.skipped.includes(state.current)) state.skipped.push(state.current);
        if(state.current < state.total-1){ state.current++; saveState(); renderQuestion(); updateProgress(); updateNav(); }
        else { updateProgress(); updateNav(); renderQuestion(); }
    }
    function navigate(dir) { if(state.submitted) return; const nxt = state.current+dir; if(nxt>=0 && nxt<state.total){ state.current=nxt; saveState(); renderQuestion(); updateProgress(); updateNav(); } }
    function updateProgress() { const a = Object.keys(state.answers).length; document.getElementById('answeredCount').textContent = `${a} answered`; document.getElementById('progressFill').style.width = Math.round((a/state.total)*100)+'%'; }
    function updateNav() { document.getElementById('btnPrev').disabled = state.current===0; document.getElementById('btnNext').disabled = state.current===state.total-1; }

    function submitQuiz() {
        const skipped = state.total - Object.keys(state.answers).length;
        if(skipped>0 && !confirm(`You have ${skipped} unanswered. Submit anyway?`)) return;
        state.submitted = true; saveState(); showResults(); switchScreen('resultsScreen');
    }

    function showResults() {
        let correct = 0; const review = [];
        state.indices.forEach((bi,i)=>{ const q = questionBank[bi]; const ua = state.answers[i]; const ok = ua===q.ans; if(ok) correct++; review.push({ q:q.q, opts:q.opts, correctAns:q.ans, userAns:ua, isCorrect:ok, idx:i+1 }); });
        const pct = Math.round((correct/state.total)*100);
        document.getElementById('scorePercent').textContent = pct+'%';
        document.getElementById('scoreFraction').textContent = `${correct}/${state.total}`;
        document.getElementById('resultMessage').textContent = pct>=90?'🏆 Outstanding!':pct>=70?'👏 Great job!':pct>=50?'📖 Good effort.':'💪 Keep studying.';
        window._review = review;
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
    }

    function reviewAnswers() {
        const sec = document.getElementById('reviewSection');
        if(sec.style.display==='block'){ sec.style.display='none'; sec.innerHTML=''; return; }
        if(!window._review) return;
        sec.innerHTML = '<h3>📋 Detailed Review</h3>';
        const letters = ['A','B','C','D'];
        window._review.forEach(r=>{
            const d = document.createElement('div'); d.className = 'review-item '+(r.isCorrect?'correct-r':'wrong');
            const uTxt = r.userAns!==undefined?`${letters[r.userAns]}. ${r.opts[r.userAns]}`:'Not answered';
            const cTxt = `${letters[r.correctAns]}. ${r.opts[r.correctAns]}`;
            d.innerHTML = `<div class="rev-q">Q${r.idx}: ${r.q}</div><div class="rev-ans">Your answer: <span class="your-ans">${uTxt}</span><br>Correct: <span class="correct-ans">${cTxt}</span></div>`;
            sec.appendChild(d);
        });
        sec.style.display='block'; sec.scrollIntoView({behavior:'smooth'});
    }

    function restartQuiz() {
        clearState(); saveState();
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
        window._review = null; switchScreen('startScreen');
        document.getElementById('resumeSection').style.display='none'; updateResumeBtn();
    }

    function updateResumeBtn() {
        const s = document.getElementById('resumeSection');
        if(loadState() && state.indices.length && !state.submitted){ s.style.display='block'; }
        else { s.style.display='none'; clearState(); saveState(); }
    }

    document.addEventListener('keydown',(e)=>{
        if(state.submitted || !document.getElementById('quizScreen').classList.contains('active')) return;
        switch(e.key.toLowerCase()){
            case 'a': selectOption(0); break;
            case 'b': selectOption(1); break;
            case 'c': selectOption(2); break;
            case 'd': selectOption(3); break;
            case 'arrowleft': e.preventDefault(); navigate(-1); break;
            case 'arrowright': e.preventDefault(); navigate(1); break;
            case 's': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); skipQuestion(); } break;
            case 'enter': e.preventDefault(); if(Object.keys(state.answers).length===state.total) submitQuiz(); break;
        }
    });

    updateResumeBtn();
    switchScreen('startScreen');
</script>
