<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHM 108 · Qualitative Analysis Quiz</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --primary: #00838f;
            --primary-dark: #006064;
            --accent: #1a1a2e;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --correct: #00b894;
            --incorrect: #e17055;
            --warning: #fdcb6e;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.3s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',Inter,system-ui,sans-serif;
            background:var(--bg);min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            padding:20px;line-height:1.6;color:var(--text);
        }
        .container{
            width:100%;max-width:850px;background:var(--card-bg);
            border-radius:var(--radius);box-shadow:var(--shadow);
            padding:32px 28px;position:relative;overflow:hidden;transition:var(--transition);
        }
        .quiz-header{text-align:center;margin-bottom:20px;}
        .quiz-header .chem-icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .quiz-header h1{font-size:1.5rem;color:var(--primary-dark);font-weight:700;}
        .subtitle{font-size:0.85rem;color:var(--text-light);margin-top:4px;}
        .screen{display:none;animation:fadeIn 0.4s;}
        .screen.active{display:block;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
        .start-options{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0 18px;}
        .start-btn{
            flex:1;min-width:150px;padding:22px 16px;border:2px solid var(--border);
            border-radius:var(--radius);background:var(--card-bg);cursor:pointer;
            text-align:center;font-weight:600;transition:var(--transition);color:var(--text);
        }
        .start-btn:hover{border-color:var(--primary);box-shadow:0 8px 20px rgba(0,131,143,0.12);transform:translateY(-2px);}
        .start-btn .icon{font-size:2.2rem;display:block;margin-bottom:4px;}
        .start-btn .badge{background:var(--primary);color:#fff;font-size:0.75rem;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:6px;}
        .start-info{font-size:0.8rem;color:var(--text-light);text-align:center;}
        .progress-wrap{margin-bottom:16px;}
        .progress-stats{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-light);margin-bottom:4px;}
        .progress-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#26c6da);border-radius:10px;transition:width 0.4s;}
        .question-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
        .dot{width:10px;height:10px;border-radius:50%;background:var(--border);cursor:pointer;transition:var(--transition);}
        .dot.answered{background:var(--primary);opacity:0.6;}
        .dot.current{background:var(--primary);transform:scale(1.5);box-shadow:0 0 0 4px rgba(0,131,143,0.2);}
        .dot.skipped{background:var(--warning);}
        .question-card{background:#fafbfc;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid var(--border);}
        .question-number{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--primary);font-weight:700;margin-bottom:6px;}
        .question-text{font-size:1.05rem;font-weight:600;color:var(--text);}
        .options-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px;}
        .option-item{
            padding:14px 16px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:#fff;
            display:flex;align-items:center;gap:10px;transition:var(--transition);font-size:0.95rem;user-select:none;
        }
        .option-item:hover{border-color:#b2bec3;background:#f8f9fa;}
        .option-item.selected{border-color:var(--primary);background:#e0f2f1;font-weight:600;}
        .option-item .radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
            display:flex;align-items:center;justify-content:center;transition:var(--transition);}
        .option-item.selected .radio-dot{border-color:var(--primary);background:var(--primary);}
        .option-item.selected .radio-dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%;}
        .option-item .opt-letter{font-weight:700;color:var(--primary);width:24px;}
        .nav-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px;}
        .btn{padding:11px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:600;font-size:0.9rem;
            transition:var(--transition);display:inline-flex;align-items:center;gap:6px;}
        .btn-outline{background:#fff;border:2px solid var(--border);color:var(--text);}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary);}
        .btn-primary{background:var(--primary);color:#fff;border:2px solid var(--primary);}
        .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
        .btn-submit{background:var(--accent);color:#fff;border:2px solid var(--accent);font-size:1rem;padding:13px 32px;}
        .btn-submit:hover{background:#2d2d4e;}
        .btn:disabled{opacity:0.5;pointer-events:none;}
        .results-card{text-align:center;}
        .score-circle{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;
            justify-content:center;flex-direction:column;border:6px solid var(--primary);font-weight:700;}
        .score-circle .big-score{font-size:2.8rem;color:var(--primary);}
        .score-circle .total{font-size:0.9rem;color:var(--text-light);}
        .result-message{font-size:1.1rem;margin-bottom:20px;font-weight:500;}
        .review-section{text-align:left;margin-top:24px;max-height:400px;overflow-y:auto;padding-right:8px;}
        .review-item{background:#fafbfc;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border);font-size:0.9rem;}
        .review-item.wrong{border-left-color:var(--incorrect);background:#fffaf9;}
        .review-item.correct-r{border-left-color:var(--correct);background:#f9fffb;}
        .review-item .rev-q{font-weight:600;margin-bottom:4px;}
        .review-item .rev-ans{font-size:0.82rem;color:var(--text-light);}
        .correct-ans{color:var(--correct);font-weight:600;}
        .your-ans{color:var(--incorrect);font-weight:600;text-decoration:line-through;}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
            padding:10px 22px;border-radius:25px;font-size:0.85rem;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s;}
        .toast.show{opacity:1;}
        @media(max-width:600px){
            .container{padding:20px 14px;}
            .start-btn{min-width:120px;padding:16px 12px;}
            .question-text{font-size:0.95rem;}
        }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="toast" id="toast"></div>

    <!-- START SCREEN -->
    <div class="screen active" id="startScreen">
        <div class="quiz-header">
            <span class="chem-icon">🔬</span>
            <h1>CHM 108 · Qualitative Analysis Quiz</h1>
            <p class="subtitle">250 Medium to Hard Questions — Dr Akpa's Course Material</p>
        </div>
        <p style="text-align:center;font-weight:500;">Select quiz length:</p>
        <div class="start-options">
            <button class="start-btn" onclick="startQuiz(30)"><span class="icon">📝</span>30 Questions<span class="badge">~30 min</span></button>
            <button class="start-btn" onclick="startQuiz(60)"><span class="icon">📚</span>60 Questions<span class="badge">~60 min</span></button>
        </div>
        <p class="start-info">🎲 Questions randomly selected · No timer · Resume supported</p>
        <div id="resumeSection" style="text-align:center;margin-top:14px;display:none;">
            <button class="btn btn-outline" onclick="resumeQuiz()">🔄 Resume previous quiz</button>
            <button class="btn btn-outline" onclick="clearStorage()" style="margin-left:8px;color:#e17055;">🗑 Clear saved</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <div class="quiz-header"><span style="font-size:1.8rem;">🧪</span></div>
        <div class="progress-wrap">
            <div class="progress-stats"><span id="progressLabel">Question 1 of 30</span><span id="answeredCount">0 answered</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
            <div class="question-dots" id="questionDots"></div>
        </div>
        <div class="question-card">
            <div class="question-number" id="questionNumber">QUESTION 1</div>
            <div class="question-text" id="questionText"></div>
        </div>
        <ul class="options-list" id="optionsList"></ul>
        <div class="nav-buttons">
            <button class="btn btn-outline" id="btnPrev" onclick="navigate(-1)">◀ Prev</button>
            <div class="nav-center">
                <button class="btn btn-outline" id="btnSkip" onclick="skipQuestion()">⏭ Skip</button>
                <button class="btn btn-submit" id="btnSubmit" onclick="submitQuiz()">✅ Submit</button>
            </div>
            <button class="btn btn-outline" id="btnNext" onclick="navigate(1)">Next ▶</button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="screen" id="resultsScreen">
        <div class="results-card">
            <div class="quiz-header"><h1>📊 Quiz Results</h1></div>
            <div class="score-circle"><span class="big-score" id="scorePercent">0%</span><span class="total" id="scoreFraction">0/30</span></div>
            <div class="result-message" id="resultMessage"></div>
            <button class="btn btn-primary" onclick="restartQuiz()">🔄 New Quiz</button>
            <button class="btn btn-outline" onclick="reviewAnswers()" style="margin-left:8px;">🔍 Review</button>
            <div class="review-section" id="reviewSection" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    // ========== 250 QUESTION BANK ==========
    const questionBank = [
        { q: "Why is a preliminary physical examination of an unknown salt important before proceeding with chemical tests?", opts: ["It determines the exact concentration.", "It can provide immediate clues about the presence of certain ions based on color or smell.", "It is the only way to confirm ammonium ions.", "It is a quantitative analysis technique."], ans: 1 },
        { q: "A student observes that an unknown salt has a distinct yellow color. Which cation is LEAST likely to be present?", opts: ["Fe³⁺ (Ferric)", "PbI₂ as a compound", "Cu²⁺", "BaS"], ans: 2 },
        { q: "The 'dry heating test' primarily provides information about:", opts: ["Exact pH of the salt solution.", "Water of crystallization or gases like CO₂, SO₂, or NH₃.", "Color of the cation in solution.", "Solubility product."], ans: 1 },
        { q: "An 'amorphous' salt indicates that its structure:", opts: ["Has a well-defined crystal lattice.", "Has no long-range order.", "Is always white.", "Is highly soluble."], ans: 1 },
        { q: "If a salt floats on water, what can you infer?", opts: ["It is highly soluble.", "It is less dense than water.", "It is an organic compound.", "It contains heavy metals."], ans: 1 },
        { q: "A 'rotten egg' smell suggests which anion?", opts: ["Cl⁻", "NO₃⁻", "S²⁻", "I⁻"], ans: 2 },
        { q: "Why is the ammonium test done before other anion tests?", opts: ["Ammonium salts are colorless.", "Evolved NH₃ can interfere with other tests.", "It is the only test with NaOH.", "Ammonium is a cation, so it comes first."], ans: 1 },
        { q: "In the test for NH₄⁺, what observation confirms its presence?", opts: ["White precipitate.", "Colorless, pungent gas turns damp red litmus blue.", "Brown gas evolved.", "Solution turns yellow."], ans: 1 },
        { q: "Which is NOT a typical observation during dry heating?", opts: ["Steam/condensation.", "Sublimation of a colored solid.", "Formation of a metallic mirror.", "Precise mass change measurement."], ans: 3 },
        { q: "A black-colored salt could contain:", opts: ["Hg₂I₂", "FeCl₃", "MnO₂", "CdS (yellow)"], ans: 2 },
        { q: "The density test involving putting salt in a test tube is used to:", opts: ["Measure exact density.", "Differentiate between 'light' and 'dense' salts.", "Test water solubility.", "Check for organic matter."], ans: 1 },
        { q: "If a salt is hydrated, what might you see on dry heating?", opts: ["Brown gas.", "Water vapor (condensation).", "Violent explosion.", "No change."], ans: 1 },
        { q: "Two white powders, NaCl and Na₂CO₃, can be quickly differentiated by:", opts: ["Color observation.", "Smell.", "Adding dilute acid and observing effervescence.", "Microscopic crystal shape."], ans: 2 },
        { q: "Observation of 'smoke' or 'clear water' during dry heating could indicate:", opts: ["Carbon or water of crystallization.", "Noble gases.", "Sulfide.", "Nitrate."], ans: 0 },
        { q: "Which cation is NOT typically associated with a colored salt?", opts: ["Copper(II)", "Sodium", "Ferric", "Nickel(II)"], ans: 1 },
        { q: "The reaction for the ammonia test is best represented by:", opts: ["NH₄⁺ + OH⁻ → NH₃·H₂O → NH₃(g) + H₂O", "NH₄⁺ + H⁺ → NH₃(g) + H₂", "NH₄⁺ + Cl⁻ → NH₄Cl(g)", "NH₄⁺ + heat → N₂(g) + H₂(g)"], ans: 0 },
        { q: "A salt sample is dark green. Which two cations are known for green compounds?", opts: ["Cu²⁺ and Fe³⁺", "Ni²⁺ and Cr³⁺", "Co²⁺ and Mn²⁺", "Pb²⁺ and Hg₂²⁺"], ans: 1 },
        { q: "A limitation of preliminary physical examination is:", opts: ["Requires expensive equipment.", "Can give false positives (similar colors).", "Is destructive.", "Only works for organic compounds."], ans: 1 },
        { q: "A white sublimate on the cooler part of the test tube during dry heating is characteristic of:", opts: ["Carbonate", "Nitrate", "Ammonium salt (e.g., NH₄Cl)", "Sulfate"], ans: 2 },
        { q: "Why use a dry test tube for the dry heating test?", opts: ["Prevent violent reaction with water.", "Avoid observing water vapor from the tube itself.", "Make the tube heavier.", "Increase solubility."], ans: 1 },
        { q: "A salt produces a colorless gas that relights a glowing splint. What can be concluded?", opts: ["CO₂ is evolved.", "O₂ is evolved, possibly from nitrate/chlorate.", "NH₃ is evolved.", "H₂S is evolved."], ans: 1 },
        { q: "To observe the 'solution' color, you must first:", opts: ["Heat to melting point.", "Dissolve in water or dilute acid.", "React with concentrated H₂SO₄.", "Filter the salt."], ans: 1 },
        { q: "A blue solution is obtained. Which ion is definitely NOT present?", opts: ["Cu²⁺", "Ni²⁺ (some complexes)", "Fe²⁺", "Na⁺"], ans: 2 },
        { q: "The process of a solid turning directly into a gas is called:", opts: ["Evaporation", "Condensation", "Sublimation", "Fusion"], ans: 2 },
        { q: "A student notes a bleach-like smell. This is most likely due to:", opts: ["Chloride", "Hypochlorite", "Sulfate", "Carbonate"], ans: 1 },
        { q: "Hg₂I₂ and CrCl₃ are listed together. What color are they likely?", opts: ["Green", "Yellow", "Black", "Red"], ans: 1 },
        { q: "If an unknown salt is completely white and crystalline, you can conclude:", opts: ["It is pure NaCl.", "It contains no transition metals with characteristic colors.", "It is organic.", "It is highly reactive."], ans: 1 },
        { q: "Why is smell tested cautiously?", opts: ["Smell provides no useful info.", "Some vapors are toxic/corrosive.", "It is unreliable.", "It requires a fume hood for all."], ans: 1 },
        { q: "A salt dissolved in dilute acid produces a colorless, odorless gas that turns limewater milky. The anion is:", opts: ["CO₃²⁻", "SO₄²⁻", "Cl⁻", "NO₃⁻"], ans: 0 },
        { q: "The physical examination in qualitative analysis is best described as:", opts: ["Quantitative measurement.", "Non-destructive observations guiding further analysis.", "Final identification step.", "Replacement for confirmatory tests."], ans: 1 },
        { q: "How to physically differentiate PbI₂ (yellow) and AgBr (pale yellow/cream) without chemicals?", opts: ["By smell.", "By checking density (PbI₂ is very dense).", "By water solubility.", "Impossible as both are yellow powders."], ans: 1 },
        { q: "A gas with a suffocating smell of burning sulfur during dry heating suggests:", opts: ["Chloride", "Sulfite or bisulfite", "Nitrate", "Acetate"], ans: 1 },
        { q: "Difference between crystalline and amorphous solids under a magnifying glass:", opts: ["Crystalline have defined shapes; amorphous are irregular.", "Crystalline are always colored.", "Amorphous are always soft.", "Crystalline melt lower."], ans: 0 },
        { q: "The density test (sink/float) is most useful for:", opts: ["Soluble salts.", "Insoluble salts with very high or low specific gravity.", "Organic salts.", "All salts equally."], ans: 1 },
        { q: "A hygroscopic salt during physical examination would appear:", opts: ["Wet or deliquesced surface.", "Invisible.", "Emit a gas.", "A different color."], ans: 0 },
        { q: "The purpose of a cobalt glass is to:", opts: ["See precipitate color clearly.", "Filter out yellow light from sodium flame to see other metals.", "Measure liquid density.", "Heat sample higher."], ans: 1 },
        { q: "Which is NOT a typical preliminary test category?", opts: ["Physical examination (color, smell)", "Dry heating test", "Flame test (implied)", "Electrical conductivity measurement"], ans: 3 },
        { q: "A 'characteristic smell of bottleneck' is a clue for which anion?", opts: ["Chloride", "Nitrate", "Sulfide", "Acetate"], ans: 2 },
        { q: "If a salt melts then decomposes during dry heating, this indicates:", opts: ["Pure and stable.", "Low melting point and possibly organic or NH₄NO₃.", "Incorrect test.", "It is a metal."], ans: 1 },
        { q: "Which physical property best differentiates NaCl from sugar without tasting?", opts: ["Color", "Crystal shape (cubic vs. monoclinic)", "Odor", "Density"], ans: 1 },
        { q: "No change during dry heating implies:", opts: ["Pure SiO₂ or very stable anhydrous salt.", "Not heated enough.", "Definitely NaCl.", "Test failed."], ans: 0 },
        { q: "Ferric chloride and nitrate often have what common color (hydrated)?", opts: ["Yellow", "Blue", "Green", "White"], ans: 0 },
        { q: "Why is relying solely on color to identify a cation unwise?", opts: ["Colors can be masked.", "Different compounds of same cation can have different colors.", "Impurities change apparent color.", "All of the above."], ans: 3 },
        { q: "When testing for NH₄⁺ with NaOH, what precaution is needed?", opts: ["Cool tube immediately.", "Do not point tube mouth at anyone (pungent NH₃).", "Add excess concentrated H₂SO₄.", "Perform in sealed container."], ans: 1 },
        { q: "What does 'water of crystallization' refer to?", opts: ["Water trapped in crystal lattice of hydrated salt.", "Water used to dissolve salt.", "Water from chemical reaction.", "Water in beaker for heating."], ans: 0 },
        { q: "A black residue after dry heating is likely:", opts: ["Carbon from organic or carbonate decomposition.", "Pure metal.", "Chloride salt.", "Water vapor."], ans: 0 },
        { q: "The brown gas evolved from nitrates with conc. H₂SO₄ is:", opts: ["NO₂, turns damp blue litmus red", "NH₃, turns blue", "SO₂, turns red", "Cl₂, bleaches it"], ans: 0 },
        { q: "Main drawback of preliminary tests compared to quantitative analysis:", opts: ["Less reliable, presence/absence only, not amounts.", "Take very long.", "Require expensive instruments.", "Always destructive."], ans: 0 },
        { q: "A pale pink solid salt is characteristic of which hydrated cation?", opts: ["Co²⁺", "Mn²⁺", "Cu²⁺", "Cr³⁺"], ans: 1 },
        { q: "A 'brick red' compound listed might be:", opts: ["HgS", "PbI₂", "CuSO₄", "FeCl₃"], ans: 0 },
        { q: "In the silver nitrate test for chloride, the precipitate formed is:", opts: ["AgCl₂", "Ag₂Cl", "AgCl", "AgClO₃"], ans: 2 },
        { q: "A white precipitate with AgNO₃ insoluble in water. How to confirm it is AgCl and not Ag₂SO₄?", opts: ["Ag₂SO₄ dissolves completely in NH₃, AgCl partially.", "Add conc. H₂SO₄.", "Precipitate turns grey in sunlight.", "Both A and C are valid."], ans: 3 },
        { q: "Why does AgCl precipitate turn grey in sunlight?", opts: ["Absorbs water vapor.", "Decomposes to form metallic silver (Ag).", "Reacts with CO₂.", "Oxidizes to AgClO₃."], ans: 1 },
        { q: "The complex ion formed when AgCl dissolves in excess aqueous NH₃ is:", opts: ["[Ag(NH₃)₄]⁺", "[Ag(NH₃)₂]⁺", "[Ag(NH₃)₂]²⁺", "[Ag(NH₃)₄]²⁺"], ans: 1 },
        { q: "A pale yellow precipitate with AgNO₃ indicates which halide?", opts: ["Cl⁻", "Br⁻", "I⁻", "F⁻"], ans: 1 },
        { q: "AgBr solubility in excess NH₃ compared to AgCl:", opts: ["More soluble.", "Similarly soluble.", "Less soluble, only slightly or not at all.", "Both equally insoluble."], ans: 2 },
        { q: "The text states AgBr precipitate 'turns grey slowly when exposed to sunlight'. This reaction is:", opts: ["Faster than AgCl.", "Slower than AgCl.", "Not a decomposition.", "Irreversible."], ans: 1 },
        { q: "When conc. H₂SO₄ is added to a bromide salt, the reddish-brown gas evolved is:", opts: ["SO₂", "Br₂", "HBr", "O₂"], ans: 1 },
        { q: "The role of conc. H₂SO₄ in the test for bromides is:", opts: ["Reducing agent.", "Oxidizing agent, converting HBr to Br₂.", "Dehydrating agent only.", "Base."], ans: 1 },
        { q: "For iodides, conc. H₂SO₄ produces violet vapors. The confirmatory test for these vapors is:", opts: ["Turn limewater milky.", "Turn starch paper blue-black.", "Rotten egg smell.", "Relight a glowing splint."], ans: 1 },
        { q: "In the iodide reaction: KI + H₂SO₄ → KHSO₄ + HI, then 2HI + H₂SO₄ → SO₂ + I₂ + 2H₂O. The role of H₂SO₄ in the second step is:", opts: ["Reducing agent", "Acid", "Oxidizing agent", "Catalyst"], ans: 2 },
        { q: "Silver iodide (AgI) precipitate is:", opts: ["White", "Pale yellow", "Bright yellow", "Brick red"], ans: 2 },
        { q: "A yellow precipitate with AgNO₃ insoluble in dilute NH₃ confirms:", opts: ["Cl⁻", "Br⁻", "I⁻", "CO₃²⁻"], ans: 2 },
        { q: "In the nitrate test, why is copper turning or paper added?", opts: ["To catalyze the reaction.", "Carbon reduces HNO₃ to NO₂ (brown gas) for visibility.", "To absorb brown gas.", "To prevent SO₂ evolution."], ans: 1 },
        { q: "The brown gas evolved in the nitrate test is:", opts: ["Nitrogen dioxide (NO₂)", "Nitrous oxide (N₂O)", "Nitric oxide (NO)", "Ammonia (NH₃)"], ans: 0 },
        { q: "Which anion does NOT produce a precipitate with AgNO₃ under normal conditions?", opts: ["Cl⁻", "Br⁻", "I⁻", "NO₃⁻"], ans: 3 },
        { q: "A gas that turns damp blue litmus paper red is:", opts: ["Basic", "Acidic", "Neutral", "Oxidizing"], ans: 1 },
        { q: "PbCl₂(s) + 2KI(aq) → PbI₂(s) + 2KCl(aq). Color change observed:", opts: ["White precipitate to yellow precipitate.", "Yellow to white.", "Colorless to blue.", "No change."], ans: 0 },
        { q: "The reaction in Q68 is a confirmatory test for:", opts: ["Pb²⁺ or I⁻", "Cl⁻", "KCl preparation", "Lead salt solubility demonstration"], ans: 0 },
        { q: "A valid confirmatory test for bromide without silver nitrate:", opts: ["Add BaCl₂.", "Liberation of reddish-brown Br₂ vapor with conc. H₂SO₄ and MnO₂.", "Add NaOH and heat.", "Add dilute HCl."], ans: 1 },
        { q: "How to test for Cl⁻ in presence of I⁻ without interference?", opts: ["Add AgNO₃ directly.", "Acidify with HNO₃, add AgNO₃, then excess NH₃. AgCl dissolves, AgI remains.", "Add conc. H₂SO₄.", "Impossible."], ans: 1 },
        { q: "Why acidify with dilute HNO₃ before adding AgNO₃?", opts: ["Prevent precipitation of carbonates, phosphates, or oxides.", "Increase AgCl solubility.", "Speed up reaction.", "Neutralize solution."], ans: 0 },

        { q: "Yellow precipitate with AgNO₃; separate test with conc. H₂SO₄ gives violet vapor turning starch paper blue. Anion:", opts: ["Br⁻", "I⁻", "Cl⁻", "NO₃⁻"], ans: 1 },

        { q: "Why is the systematic approach (physical -> preliminary -> anion -> cation) considered logical?", opts: ["Starts with easiest, non-destructive tests and moves to specific confirmatory tests, building a case.", "Follows alphabetical order.", "It is the fastest.", "It is the only possible sequence."], ans: 0 }

    // ========== STATE MANAGEMENT ==========
    const STATE_KEY = 'chm108_quiz_state';
    let state = { total: 30, indices: [], current: 0, answers: {}, skipped: [], submitted: false };

    function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    function loadState() { const r = localStorage.getItem(STATE_KEY); if(r){try{state=JSON.parse(r);return true;}catch(e){}} return false; }
    function clearState() { state = { total:30,indices:[],current:0,answers:{},skipped:[],submitted:false}; localStorage.removeItem(STATE_KEY); }

    function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function getQ() { if(!state.indices.length) return null; const bi = state.indices[state.current]; return {...questionBank[bi], bankIndex:bi}; }

    function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function startQuiz(n) {
        clearState();
        const allIndices = shuffle(Array.from({length: questionBank.length}, (_,i)=>i));
        const selected = allIndices.slice(0, n);
        state = { total: n, indices: selected, current: 0, answers: {}, skipped: [], submitted: false };
        saveState(); renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav();
    }

    function resumeQuiz() {
        if(!loadState() || !state.indices.length || state.submitted){ toast('No saved quiz. Start a new one.'); return; }
        renderQuiz(); switchScreen('quizScreen'); renderQuestion(); updateProgress(); updateNav(); toast('Quiz resumed.');
    }

    function clearStorage() { clearState(); saveState(); document.getElementById('resumeSection').style.display='none'; toast('Saved progress cleared.'); }

    function renderQuiz() {
        const dots = document.getElementById('questionDots'); dots.innerHTML = '';
        for(let i=0;i<state.total;i++){ const d=document.createElement('span'); d.className='dot'; d.title=`Q${i+1}`; d.onclick=()=>{state.current=i;saveState();renderQuestion();updateProgress();updateNav();}; dots.appendChild(d); }
    }

    function renderQuestion() {
        const q = getQ(); if(!q) return;
        document.getElementById('questionNumber').textContent = `QUESTION ${state.current+1}`;
        document.getElementById('questionText').textContent = q.q;
        document.getElementById('progressLabel').textContent = `Question ${state.current+1} of ${state.total}`;
        const opts = document.getElementById('optionsList'); opts.innerHTML = '';
        const letters = ['A','B','C','D'];
        q.opts.forEach((opt,i)=>{
            const li = document.createElement('li'); li.className='option-item';
            if(state.answers[state.current]===i) li.classList.add('selected');
            li.innerHTML = `<span class="radio-dot"></span><span class="opt-letter">${letters[i]}.</span><span>${opt}</span>`;
            li.onclick = ()=> selectOption(i);
            opts.appendChild(li);
        });
        const dots = document.querySelectorAll('#questionDots .dot');
        dots.forEach((d,i)=>{ d.classList.remove('current','answered','skipped'); if(i===state.current) d.classList.add('current'); if(state.answers[i]!==undefined) d.classList.add('answered'); if(state.skipped.includes(i) && state.answers[i]===undefined) d.classList.add('skipped'); });
        document.getElementById('quizScreen').scrollIntoView({behavior:'smooth',block:'start'});
    }

    function selectOption(i) { if(state.submitted) return; state.answers[state.current]=i; state.skipped = state.skipped.filter(s=>s!==state.current); saveState(); renderQuestion(); updateProgress(); updateNav(); }
    function skipQuestion() {
        if(state.submitted) return;
        if(state.answers[state.current]===undefined && !state.skipped.includes(state.current)) state.skipped.push(state.current);
        if(state.current < state.total-1){ state.current++; saveState(); renderQuestion(); updateProgress(); updateNav(); }
        else { updateProgress(); updateNav(); renderQuestion(); }
    }
    function navigate(dir) { if(state.submitted) return; const nxt = state.current+dir; if(nxt>=0 && nxt<state.total){ state.current=nxt; saveState(); renderQuestion(); updateProgress(); updateNav(); } }
    function updateProgress() { const a = Object.keys(state.answers).length; document.getElementById('answeredCount').textContent = `${a} answered`; document.getElementById('progressFill').style.width = Math.round((a/state.total)*100)+'%'; }
    function updateNav() { document.getElementById('btnPrev').disabled = state.current===0; document.getElementById('btnNext').disabled = state.current===state.total-1; }

    function submitQuiz() {
        const skipped = state.total - Object.keys(state.answers).length;
        if(skipped>0 && !confirm(`You have ${skipped} unanswered. Submit anyway?`)) return;
        state.submitted = true; saveState(); showResults(); switchScreen('resultsScreen');
    }

    function showResults() {
        let correct = 0; const review = [];
        state.indices.forEach((bi,i)=>{ const q = questionBank[bi]; const ua = state.answers[i]; const ok = ua===q.ans; if(ok) correct++; review.push({ q:q.q, opts:q.opts, correctAns:q.ans, userAns:ua, isCorrect:ok, idx:i+1 }); });
        const pct = Math.round((correct/state.total)*100);
        document.getElementById('scorePercent').textContent = pct+'%';
        document.getElementById('scoreFraction').textContent = `${correct}/${state.total}`;
        document.getElementById('resultMessage').textContent = pct>=90?'🏆 Outstanding!':pct>=70?'👏 Great job!':pct>=50?'📖 Good effort.':'💪 Keep studying.';
        window._review = review;
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
    }

    function reviewAnswers() {
        const sec = document.getElementById('reviewSection');
        if(sec.style.display==='block'){ sec.style.display='none'; sec.innerHTML=''; return; }
        if(!window._review) return;
        sec.innerHTML = '<h3>📋 Detailed Review</h3>';
        const letters = ['A','B','C','D'];
        window._review.forEach(r=>{
            const d = document.createElement('div'); d.className = 'review-item '+(r.isCorrect?'correct-r':'wrong');
            const uTxt = r.userAns!==undefined?`${letters[r.userAns]}. ${r.opts[r.userAns]}`:'Not answered';
            const cTxt = `${letters[r.correctAns]}. ${r.opts[r.correctAns]}`;
            d.innerHTML = `<div class="rev-q">Q${r.idx}: ${r.q}</div><div class="rev-ans">Your answer: <span class="your-ans">${uTxt}</span><br>Correct: <span class="correct-ans">${cTxt}</span></div>`;
            sec.appendChild(d);
        });
        sec.style.display='block'; sec.scrollIntoView({behavior:'smooth'});
    }

    function restartQuiz() {
        clearState(); saveState();
        document.getElementById('reviewSection').style.display='none'; document.getElementById('reviewSection').innerHTML='';
        window._review = null; switchScreen('startScreen');
        document.getElementById('resumeSection').style.display='none'; updateResumeBtn();
    }

    function updateResumeBtn() {
        const s = document.getElementById('resumeSection');
        if(loadState() && state.indices.length && !state.submitted){ s.style.display='block'; }
        else { s.style.display='none'; clearState(); saveState(); }
    }

    document.addEventListener('keydown',(e)=>{
        if(state.submitted || !document.getElementById('quizScreen').classList.contains('active')) return;
        switch(e.key.toLowerCase()){
            case 'a': selectOption(0); break;
            case 'b': selectOption(1); break;
            case 'c': selectOption(2); break;
            case 'd': selectOption(3); break;
            case 'arrowleft': e.preventDefault(); navigate(-1); break;
            case 'arrowright': e.preventDefault(); navigate(1); break;
            case 's': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); skipQuestion(); } break;
            case 'enter': e.preventDefault(); if(Object.keys(state.answers).length===state.total) submitQuiz(); break;
        }
    });

    updateResumeBtn();
    switchScreen('startScreen');
</script>
