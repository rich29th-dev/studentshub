<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHM 108 — Practice Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --amber: #e6a817;
    --amber-dim: #7a5a0e;
    --green: #3fb950;
    --red: #f85149;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --blue: #58a6ff;
    --panel-w: 280px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 54px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
  }
  .topbar-brand {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 600; color: var(--amber);
    letter-spacing: 0.04em;
  }
  .topbar-brand span { color: var(--text-muted); font-weight: 400; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .nav-toggle {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: border-color .2s;
  }
  .nav-toggle:hover { border-color: var(--amber); color: var(--amber); }
  .nav-toggle svg { width: 14px; height: 14px; }
  #score-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--text-muted);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
  }

  /* ── LAYOUT ── */
  .layout { display: flex; margin-top: 54px; min-height: calc(100vh - 54px); }

  /* ── NAV PANEL ── */
  .nav-panel {
    width: var(--panel-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    position: fixed; top: 54px; left: 0; bottom: 0;
    overflow-y: auto; padding: 16px 12px;
    transition: transform .3s ease;
    z-index: 50;
  }
  .nav-panel.hidden { transform: translateX(calc(-1 * var(--panel-w))); }
  .nav-panel-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 0 6px 10px; margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .nav-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px;
  }
  .nav-btn {
    aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text-muted);
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: all .15s; font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { border-color: var(--amber); color: var(--amber); }
  .nav-btn.current { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); }
  .nav-btn.correct { border-color: var(--green); background: rgba(63,185,80,.15); color: var(--green); }
  .nav-btn.wrong { border-color: var(--red); background: rgba(248,81,73,.15); color: var(--red); }
  .nav-btn.answered { border-color: var(--blue); background: rgba(88,166,255,.1); color: var(--blue); }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1;
    margin-left: var(--panel-w);
    transition: margin-left .3s ease;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 20px 80px;
    min-height: calc(100vh - 54px);
  }
  .main.panel-hidden { margin-left: 0; }

  /* ── PROGRESS CYLINDER ── */
  .progress-wrap {
    width: 100%; max-width: 680px; margin-bottom: 28px;
    display: flex; align-items: center; gap: 14px;
  }
  .cylinder-outer {
    flex: 1; height: 10px; background: var(--surface2);
    border-radius: 5px; overflow: hidden;
    border: 1px solid var(--border); position: relative;
  }
  .cylinder-inner {
    height: 100%; background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    border-radius: 5px; transition: width .4s ease;
  }
  .progress-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--text-muted); white-space: nowrap;
  }

  /* ── QUESTION CARD ── */
  .card {
    width: 100%; max-width: 680px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  .card-header {
    padding: 16px 22px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--amber); background: var(--amber-dim);
    padding: 3px 8px; border-radius: 4px; letter-spacing: 0.06em;
  }
  .q-topic {
    font-size: 11px; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .card-body { padding: 24px 22px; }
  .question-text {
    font-size: 16px; font-weight: 500; line-height: 1.6;
    color: var(--text); margin-bottom: 22px;
  }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 13px 16px;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg); position: relative; overflow: hidden;
  }
  .option:hover:not(.disabled) {
    border-color: var(--amber); background: rgba(230,168,23,.05);
  }
  .option-letter {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    color: var(--text-muted); background: var(--surface2);
    border: 1px solid var(--border);
    width: 26px; height: 26px; border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .option-text { font-size: 14px; line-height: 1.5; padding-top: 3px; }
  .option.selected .option-letter {
    background: var(--amber-dim); border-color: var(--amber); color: var(--amber);
  }
  .option.selected { border-color: var(--amber); background: rgba(230,168,23,.06); }
  .option.correct-ans { border-color: var(--green); background: rgba(63,185,80,.07); }
  .option.correct-ans .option-letter {
    background: rgba(63,185,80,.2); border-color: var(--green); color: var(--green);
  }
  .option.wrong-ans { border-color: var(--red); background: rgba(248,81,73,.07); }
  .option.wrong-ans .option-letter {
    background: rgba(248,81,73,.2); border-color: var(--red); color: var(--red);
  }
  .option.disabled { cursor: default; }
  .result-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; display: none;
  }
  .option.correct-ans .result-icon, .option.wrong-ans .result-icon { display: block; }

  /* ── EXPLANATION BOX ── */
  .explanation {
    margin-top: 18px; padding: 14px 16px;
    background: var(--surface2); border-radius: 8px;
    border-left: 3px solid var(--green);
    font-size: 13px; line-height: 1.6; color: var(--text-muted);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--text); font-weight: 600; }

  /* ── BOTTOM CONTROLS ── */
  .controls {
    width: 100%; max-width: 680px; margin-top: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .btn {
    padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s; border: 1.5px solid;
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-prev {
    background: var(--surface2); border-color: var(--border); color: var(--text-muted);
  }
  .btn-prev:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text); }
  .btn-prev:disabled { opacity: .35; cursor: default; }
  .btn-next {
    background: var(--amber); border-color: var(--amber); color: #000;
  }
  .btn-next:hover { background: #ffc340; border-color: #ffc340; }
  .btn-skip {
    background: transparent; border-color: var(--border); color: var(--text-muted);
    font-size: 13px; font-weight: 500;
  }
  .btn-skip:hover { color: var(--text); border-color: var(--text-muted); }

  /* ── RESULTS SCREEN ── */
  #results-screen {
    width: 100%; max-width: 680px; display: none;
    flex-direction: column; align-items: center; gap: 24px;
  }
  .results-card {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 36px; text-align: center;
  }
  .results-score {
    font-family: 'IBM Plex Mono', monospace; font-size: 64px; font-weight: 600;
    color: var(--amber); line-height: 1;
  }
  .results-score span { font-size: 24px; color: var(--text-muted); }
  .results-label { font-size: 15px; color: var(--text-muted); margin-top: 8px; }
  .results-stats {
    display: flex; justify-content: center; gap: 32px; margin-top: 24px;
  }
  .stat { text-align: center; }
  .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stat.c .stat-val { color: var(--green); }
  .stat.w .stat-val { color: var(--red); }
  .stat.s .stat-val { color: var(--text-muted); }
  .btn-restart {
    background: var(--amber); border: none; color: #000;
    padding: 12px 32px; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: background .15s;
  }
  .btn-restart:hover { background: #ffc340; }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-muted);
  }
  .legend-dot {
    width: 8px; height: 8px; border-radius: 2px;
  }

  @media (max-width: 600px) {
    .main { padding: 20px 12px 80px; }
    .card-body { padding: 18px 16px; }
    .controls { flex-wrap: wrap; }
    .btn-prev, .btn-next { flex: 1; justify-content: center; }
    .btn-skip { width: 100%; justify-content: center; order: 3; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">CHM&nbsp;108 <span>/ Practice Quiz</span></div>
  <div class="topbar-right">
    <div id="score-badge">0 / 0 correct</div>
    <button class="nav-toggle" onclick="togglePanel()">
      <svg viewBox="0 0 16 16" fill="currentColor">
        <rect y="2" width="16" height="1.5" rx="1"/>
        <rect y="7.25" width="16" height="1.5" rx="1"/>
        <rect y="12.5" width="16" height="1.5" rx="1"/>
      </svg>
      Questions
    </button>
  </div>
</div>

<div class="layout">
  <!-- NAV PANEL -->
  <nav class="nav-panel" id="nav-panel">
    <div class="nav-panel-title">Question Map</div>
    <div class="nav-grid" id="nav-grid"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div> Current</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Answered</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Correct</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Wrong</div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main">
    <!-- Progress -->
    <div class="progress-wrap">
      <div class="cylinder-outer">
        <div class="cylinder-inner" id="progress-bar" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 55</div>
    </div>

    <!-- Card -->
    <div class="card" id="quiz-card">
      <div class="card-header">
        <span class="q-num" id="q-num">Q 01</span>
        <span class="q-topic" id="q-topic">Qualitative Analysis</span>
      </div>
      <div class="card-body">
        <div class="question-text" id="question-text"></div>
        <div class="options" id="options-container"></div>
        <div class="explanation" id="explanation"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-prev" id="btn-prev" onclick="goTo(current-1)" disabled>← Prev</button>
      <button class="btn btn-skip" id="btn-skip" onclick="skip()">Skip →</button>
      <button class="btn btn-next" id="btn-next" onclick="next()">Next →</button>
    </div>

    <!-- Results -->
    <div id="results-screen">
      <div class="results-card">
        <div class="results-score" id="res-score">0<span>/55</span></div>
        <div class="results-label" id="res-label">Quiz Complete</div>
        <div class="results-stats">
          <div class="stat c"><div class="stat-val" id="res-correct">0</div><div class="stat-label">Correct</div></div>
          <div class="stat w"><div class="stat-val" id="res-wrong">0</div><div class="stat-label">Wrong</div></div>
          <div class="stat s"><div class="stat-val" id="res-skip">0</div><div class="stat-label">Skipped</div></div>
        </div>
      </div>
      <button class="btn-restart" onclick="restart()">Restart Quiz</button>
    </div>
  </main>
</div>

<script>
const QUESTIONS = [
  {
    q: "Which gas is colourless with a strong unpleasant odour like rotten eggs?",
    options: ["Carbon dioxide (CO₂)", "Hydrogen sulphide (H₂S)", "Sulphur dioxide (SO₂)", "Nitrogen dioxide (NO₂)"],
    answer: 1,
    explanation: "Hydrogen sulphide (H₂S) is the classic 'rotten egg' gas, produced when sulphide ions react with dilute acids."
  },
  {
    q: "What element is indicated by a brick red flame during flame testing?",
    options: ["Sodium (Na)", "Potassium (K)", "Calcium (Ca)", "Barium (Ba)"],
    answer: 2,
    explanation: "Calcium (Ca) produces a distinctive brick red colour in a flame test."
  },
  {
    q: "Which cation does NOT form insoluble chlorides with hydrochloric acid?",
    options: ["Silver (Ag⁺)", "Lead(II) (Pb²⁺)", "Mercury(I) (Hg₂²⁺)", "Copper(II) (Cu²⁺)"],
    answer: 3,
    explanation: "Copper(II) and most other cations do not form insoluble chlorides. Only Ag⁺, Pb²⁺, and Hg₂²⁺ form insoluble chlorides."
  },
  {
    q: "What element is indicated by a light blue flame during flame testing?",
    options: ["Copper (Cu)", "Lead (Pb)", "Arsenic (As)", "Selenium (Se)"],
    answer: 1,
    explanation: "Lead (Pb) gives a light blue flame in a flame test."
  },
  {
    q: "Which element is indicated by a purple/lilac flame during a flame test?",
    options: ["Sodium (Na)", "Calcium (Ca)", "Potassium (K)", "Barium (Ba)"],
    answer: 2,
    explanation: "Potassium (K) produces a characteristic purple or lilac flame, which can be seen clearly through cobalt blue glass."
  },
  {
    q: "Which cation forms insoluble sulphides in acidic conditions?",
    options: ["Iron(II) (Fe²⁺)", "Zinc (Zn²⁺)", "Copper(II) (Cu²⁺)", "Nickel (Ni²⁺)"],
    answer: 2,
    explanation: "In acidic conditions, Cu²⁺, Pb²⁺, Hg²⁺, Cd²⁺, and Bi³⁺ form insoluble sulphides. Fe²⁺, Zn²⁺, Ni²⁺, and Mn²⁺ do not."
  },
  {
    q: "What element is indicated by a yellowish green flame when carrying out a flame test?",
    options: ["Potassium (K)", "Barium (Ba)", "Copper (Cu)", "Boron (B)"],
    answer: 1,
    explanation: "Barium (Ba) produces a yellowish green flame in a flame test."
  },
  {
    q: "Why is it necessary to clean the wire loop before performing a flame test?",
    options: ["To heat the loop to the correct temperature", "To prevent contamination from previous substances", "To make the loop glow more brightly", "To remove oxidation from the surface"],
    answer: 1,
    explanation: "Contamination from previous substances on the loop could produce false flame colours and lead to incorrect identification."
  },
  {
    q: "Which salt produces a brown gas that turns damp blue litmus red and bleaches white when reacted with manganese dioxide and concentrated sulphuric acid?",
    options: ["Nitrate salt", "Sulphate salt", "Chloride salt", "Carbonate salt"],
    answer: 2,
    explanation: "A chloride salt reacts to produce chlorine gas (via MnO₂ + conc. H₂SO₄), which is brown/yellow-green, turns litmus red, and bleaches."
  },
  {
    q: "Which of these chlorides — AgCl, PbCl₂, and Hg₂Cl₂ — is soluble in hot water?",
    options: ["AgCl", "PbCl₂", "Hg₂Cl₂", "None of them"],
    answer: 1,
    explanation: "PbCl₂ (lead(II) chloride) is sparingly soluble in cold water but dissolves appreciably in hot water, unlike AgCl and Hg₂Cl₂."
  },
  {
    q: "What is the characteristic test for the presence of sulphide ions (S²⁻)?",
    options: ["Addition of BaCl₂ gives a white precipitate", "Addition of AgNO₃ gives a yellow precipitate", "Dilute acid produces H₂S gas (rotten-egg smell); lead acetate paper turns black", "Lime water turns milky"],
    answer: 2,
    explanation: "The sulphide test: dilute acid releases H₂S (rotten egg smell), and lead acetate paper turns black due to formation of PbS."
  },
  {
    q: "Which salt produces a colourless gas that readily gives reddish-brown fumes with oxygen in air when reacted with dilute sulphuric acid?",
    options: ["Nitrate salt", "Nitrite salt", "Sulphite salt", "Carbonate salt"],
    answer: 1,
    explanation: "A nitrite salt produces nitrous acid then NO gas, which reacts with O₂ in air to give reddish-brown NO₂ fumes."
  },
  {
    q: "Chloride ion cannot be oxidized by chlorine water. True or False?",
    options: ["True", "False"],
    answer: 0,
    explanation: "This is TRUE. Chloride ions are already in their reduced form and chlorine water is not strong enough to oxidize Cl⁻ further."
  },
  {
    q: "What is the characteristic test for the presence of sulphate ions (SO₄²⁻)?",
    options: ["Addition of AgNO₃ gives a white precipitate", "Addition of acidified BaCl₂ solution gives a white precipitate of BaSO₄", "Addition of dilute HCl gives a gas", "Acidified KMnO₄ is decolourized"],
    answer: 1,
    explanation: "Acidified barium chloride forms a white precipitate of barium sulphate (BaSO₄), which is insoluble in dilute HCl — confirming sulphate ions."
  },
  {
    q: "Which salt produces a violet vapour that turns starch to a blue-black complex when reacted with concentrated sulphuric acid?",
    options: ["Chloride salt", "Bromide salt", "Iodide salt", "Nitrate salt"],
    answer: 2,
    explanation: "An iodide salt releases iodine (I₂) as violet vapour when treated with conc. H₂SO₄. Iodine turns starch solution blue-black."
  },
  {
    q: "Which cation does NOT form insoluble sulphides in acidic conditions?",
    options: ["Copper(II) (Cu²⁺)", "Lead(II) (Pb²⁺)", "Iron(II) (Fe²⁺)", "Mercury(II) (Hg²⁺)"],
    answer: 2,
    explanation: "Iron(II) (Fe²⁺), along with Zn²⁺, Ni²⁺, and Mn²⁺, does not precipitate as a sulphide in acidic conditions."
  },
  {
    q: "What element is indicated by a golden yellow flame when a flame test is carried out?",
    options: ["Potassium (K)", "Calcium (Ca)", "Sodium (Na)", "Barium (Ba)"],
    answer: 2,
    explanation: "Sodium (Na) produces a persistent golden/bright yellow flame that can mask other colours — characteristic of Na contamination."
  },
  {
    q: "What element is indicated by a bright green flame when a flame test is carried out?",
    options: ["Copper (Cu)", "Chromium (Cr)", "Barium (Ba²⁺)", "Thallium (Tl)"],
    answer: 2,
    explanation: "Barium (Ba²⁺) gives a bright apple-green flame, distinguishable from the lighter yellowish-green."
  },
  {
    q: "What is the characteristic test for the presence of carbonate ions (CO₃²⁻)?",
    options: ["Addition of BaCl₂ gives a white precipitate", "Addition of AgNO₃ gives a cream precipitate", "Addition of dilute acid gives CO₂ effervescence that turns lime water milky", "Acidified KMnO₄ is decolourized"],
    answer: 2,
    explanation: "Carbonate ions react with dilute acid to release CO₂ gas, which turns lime water (Ca(OH)₂ solution) milky due to CaCO₃ formation."
  },
  {
    q: "Which salt produces an acidic brown gas that turns damp blue litmus red when reacted with concentrated sulphuric acid?",
    options: ["Chloride salt", "Sulphite salt", "Nitrate salt", "Carbonate salt"],
    answer: 2,
    explanation: "A nitrate salt with conc. H₂SO₄ produces NO₂, a brown acidic gas that turns damp blue litmus red."
  },
  {
    q: "What is the characteristic test for the presence of iodide ions (I⁻)?",
    options: ["AgNO₃ gives a white precipitate soluble in NH₃", "AgNO₃ gives a cream precipitate", "AgNO₃ gives a yellow precipitate of AgI, insoluble in ammonia", "Acidified BaCl₂ gives a white precipitate"],
    answer: 2,
    explanation: "Silver nitrate with iodide ions gives a pale yellow precipitate of AgI, which is insoluble in ammonia — distinguishing it from AgCl and AgBr."
  },
  {
    q: "The colour of the precipitate obtained when BaCl₂ solution is added to Na₂SO₄ solution is:",
    options: ["Yellow", "Blue", "White", "Brown"],
    answer: 2,
    explanation: "BaSO₄ (barium sulphate) is a white precipitate, insoluble in dilute hydrochloric acid — key confirmation for sulphate ions."
  },
  {
    q: "Which cation does NOT form insoluble hydroxides in basic conditions?",
    options: ["Copper(II) (Cu²⁺)", "Iron(III) (Fe³⁺)", "NH₄⁺ (ammonium ion)", "Aluminium (Al³⁺)"],
    answer: 2,
    explanation: "NH₄⁺ is highly soluble and does not form a precipitate with NaOH at room temperature; it releases NH₃ gas instead."
  },
  {
    q: "The physical examination of an unknown salt involves the study of:",
    options: ["Solubility in water only", "Colour, odour, crystal form, and appearance", "Flame test results only", "Reaction with dilute acids"],
    answer: 1,
    explanation: "Preliminary physical examination covers colour, odour, crystal form, and general appearance as the first step in qualitative analysis."
  },
  {
    q: "Which anion produces a colourless gas that turns lime water milky when heated with dilute acid?",

// Shuffle options while tracking correct answer index
function prepareQuestion(raw) {
  const indices = [0, 1, 2, 3].slice(0, raw.options.length);
  // Shuffle
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return {
    q: raw.q,
    options: indices.map(i => raw.options[i]),
    answer: indices.indexOf(raw.answer),
    explanation: raw.explanation
  };
}

let questions = [];
let current = 0;
let userAnswers = new Array(QUESTIONS.length).fill(null); // null=unanswered, -1=skipped, 0-3=answered
let submitted = new Array(QUESTIONS.length).fill(false);
let panelVisible = true;

function init() {
  questions = QUESTIONS.map(prepareQuestion);
  userAnswers = new Array(questions.length).fill(null);
  submitted = new Array(questions.length).fill(false);
  buildNavGrid();
  goTo(0);
}

function buildNavGrid() {
  const grid = document.getElementById('nav-grid');
  grid.innerHTML = '';
  questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}

function updateNavGrid() {
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach((btn, i) => {
    btn.className = 'nav-btn';
    if (i === current) { btn.classList.add('current'); return; }
    if (userAnswers[i] === null) return;
    if (userAnswers[i] === -1) return; // skipped — plain
    if (submitted[i]) {
      btn.classList.add(userAnswers[i] === questions[i].answer ? 'correct' : 'wrong');
    } else {
      btn.classList.add('answered');
    }
  });
}

function goTo(index) {
  if (index < 0 || index >= questions.length) return;
  current = index;
  renderQuestion();
  updateNavGrid();
  updateProgress();
  updateScoreBadge();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `Q ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('question-text').textContent = q.q;

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${opt}</div>
      <span class="result-icon"></span>`;

    const ua = userAnswers[current];
    if (submitted[current]) {
      div.classList.add('disabled');
      if (i === q.answer) {
        div.classList.add('correct-ans');
        div.querySelector('.result-icon').textContent = '✓';
      } else if (i === ua && ua !== q.answer) {
        div.classList.add('wrong-ans');
        div.querySelector('.result-icon').textContent = '✗';
      }
    } else {
      if (ua === i) div.classList.add('selected');
      div.onclick = () => selectOption(i);
    }
    container.appendChild(div);
  });

  const exp = document.getElementById('explanation');
  if (submitted[current]) {
    exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
    exp.classList.add('show');
  } else {
    exp.classList.remove('show');
  }

  // Update controls
  document.getElementById('btn-prev').disabled = current === 0;
  const nextBtn = document.getElementById('btn-next');
  const skipBtn = document.getElementById('btn-skip');
  if (submitted[current]) {
    nextBtn.textContent = current === questions.length - 1 ? 'Finish →' : 'Next →';
    skipBtn.style.display = 'none';
  } else {
    nextBtn.textContent = userAnswers[current] !== null && userAnswers[current] !== -1 ? 'Submit' : 'Skip →';
    skipBtn.style.display = userAnswers[current] !== null && userAnswers[current] !== -1 ? 'flex' : 'none';
  }
}

function selectOption(i) {
  if (submitted[current]) return;
  userAnswers[current] = i;
  renderQuestion();
  updateNavGrid();
}

function next() {
  const q = questions[current];
  const ua = userAnswers[current];

  if (!submitted[current] && ua !== null && ua !== -1) {
    // Submit this answer
    submitted[current] = true;
    renderQuestion();
    updateNavGrid();
    updateScoreBadge();
    return;
  }

  if (current === questions.length - 1) {
    showResults();
  } else {
    goTo(current + 1);
  }
}

function skip() {
  if (!submitted[current]) userAnswers[current] = -1;
  if (current < questions.length - 1) goTo(current + 1);
  else showResults();
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length}`;
}

function updateScoreBadge() {
  const correct = questions.filter((q, i) => submitted[i] && userAnswers[i] === q.answer).length;
  const total = submitted.filter(Boolean).length;
  document.getElementById('score-badge').textContent = `${correct} / ${total} correct`;
}

function showResults() {
  document.getElementById('quiz-card').style.display = 'none';
  document.querySelector('.controls').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  const rs = document.getElementById('results-screen');
  rs.style.display = 'flex';

  const correct = questions.filter((q, i) => submitted[i] && userAnswers[i] === q.answer).length;
  const wrong = questions.filter((q, i) => submitted[i] && userAnswers[i] !== q.answer && userAnswers[i] !== -1).length;
  const skipped = userAnswers.filter(a => a === null || a === -1).length;

  document.getElementById('res-score').innerHTML = `${correct}<span>/${questions.length}</span>`;
  const pct = Math.round((correct / questions.length) * 100);
  document.getElementById('res-label').textContent = `${pct}% — ${pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort!' : 'Keep studying!'}`;
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skip').textContent = skipped;
}

function restart() {
  document.getElementById('quiz-card').style.display = '';
  document.querySelector('.controls').style.display = '';
  document.querySelector('.progress-wrap').style.display = '';
  document.getElementById('results-screen').style.display = 'none';
  init();
}

function togglePanel() {
  panelVisible = !panelVisible;
  document.getElementById('nav-panel').classList.toggle('hidden', !panelVisible);
  document.getElementById('main').classList.toggle('panel-hidden', !panelVisible);
}

init();
</script>
